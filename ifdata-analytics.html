  <script>
/* ===== pub-store.js ===== */
/* pub-store.js — lançamentos do módulo Publicações e motor de conciliação.
   Namespace global `PST`.

   Um lançamento é uma observação única:
     { cnpj, banco, fonte, periodo, metrica, valor, referencia, url }
   A chave natural é (cnpj, fonte, periodo, metrica) — relançar sobrescreve. */
(function (global) {
  'use strict';
  var U = global.U, PUB = global.PUB;

  var CHAVE = 'riskbench.publicacoes.v1';
  var dados = [];
  var indice = new Map();

  function chaveDe(l) {
    return [l.cnpj, l.fonte, l.periodo, l.metrica].join('|');
  }

  function reindexar() {
    indice = new Map();
    dados.forEach(function (l) { indice.set(chaveDe(l), l); });
  }

  function carregar() {
    try {
      var bruto = JSON.parse(localStorage.getItem(CHAVE) || '[]');
      dados = Array.isArray(bruto) ? bruto : [];
    } catch (e) { dados = []; }
    reindexar();
    return dados;
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(dados)); return true; }
    catch (e) {
      global.UI && global.UI.toast('Não foi possível salvar: o armazenamento do navegador está cheio.', 'bad');
      return false;
    }
  }

  /* ----------------------------- escrita ------------------------------- */

  function normalizarCnpj(v) {
    var d = String(v == null ? '' : v).replace(/\D/g, '');
    if (!d) return '';
    return d.length > 8 ? d.slice(0, 8) : d.padStart(8, '0');
  }

  function registrar(l, naoSalvar) {
    var limpo = {
      cnpj: normalizarCnpj(l.cnpj),
      banco: String(l.banco || '').trim(),
      fonte: String(l.fonte || '').trim(),
      periodo: String(l.periodo || '').trim(),
      metrica: String(l.metrica || '').trim(),
      valor: U.toNumber(l.valor),
      referencia: String(l.referencia || '').trim(),
      url: String(l.url || '').trim(),
      auto: !!l.auto,
      em: l.em || new Date().toISOString()
    };
    if (!limpo.cnpj || !limpo.fonte || !limpo.periodo || !limpo.metrica) {
      return { ok: false, motivo: 'faltam cnpj, fonte, período ou métrica' };
    }
    if (!PUB.FONTE_POR_ID[limpo.fonte]) {
      return { ok: false, motivo: 'fonte desconhecida: ' + limpo.fonte };
    }
    if (!PUB.METRICA_POR_ID[limpo.metrica]) {
      return { ok: false, motivo: 'métrica fora do catálogo: ' + limpo.metrica };
    }
    if (!/^\d{4}(03|06|09|12)$/.test(limpo.periodo)) {
      return { ok: false, motivo: 'período deve ser AAAAMM de fim de trimestre: ' + limpo.periodo };
    }
    if (!U.isNum(limpo.valor)) {
      return { ok: false, motivo: 'valor não numérico: ' + l.valor };
    }
    var k = chaveDe(limpo);
    var existente = indice.get(k);
    if (existente) {
      Object.assign(existente, limpo);
    } else {
      dados.push(limpo);
      indice.set(k, limpo);
    }
    if (!naoSalvar) salvar();
    return { ok: true, substituiu: !!existente };
  }

  function remover(l) {
    var k = typeof l === 'string' ? l : chaveDe(l);
    dados = dados.filter(function (x) { return chaveDe(x) !== k; });
    reindexar(); salvar();
  }

  function limpar(filtro) {
    if (!filtro) { dados = []; }
    else {
      dados = dados.filter(function (l) {
        return !Object.keys(filtro).every(function (k) { return l[k] === filtro[k]; });
      });
    }
    reindexar(); salvar();
  }

  /* ----------------------------- leitura -------------------------------- */

  function valor(cnpj, fonte, periodo, metrica) {
    var l = indice.get([normalizarCnpj(cnpj), fonte, periodo, metrica].join('|'));
    return l && U.isNum(l.valor) ? l.valor : null;
  }
  function lancamento(cnpj, fonte, periodo, metrica) {
    return indice.get([normalizarCnpj(cnpj), fonte, periodo, metrica].join('|')) || null;
  }
  function todos() { return dados.slice(); }

  function bancosComDados() {
    var m = new Map();
    dados.forEach(function (l) { if (!m.has(l.cnpj)) m.set(l.cnpj, l.banco || l.cnpj); });
    return Array.from(m, function (e) { return { cnpj: e[0], nome: e[1] }; });
  }

  /* --------------------- espelho automático do IF.data ------------------- */

  /**
   * Copia para a fonte "ifdata" as métricas do catálogo que têm equivalente
   * calculado no módulo IF.data. É o que dá uma linha de base para conferir o
   * que foi transcrito das publicações.
   */
  function sincronizarIFData(bancos, periodo, valorDoIndicador) {
    limpar({ fonte: 'ifdata', periodo: String(periodo) });
    var n = 0;
    var comEspelho = PUB.METRICAS.filter(function (m) { return m.ifdata; });
    bancos.forEach(function (b) {
      comEspelho.forEach(function (m) {
        var v = valorDoIndicador(b, m.ifdata);
        if (!U.isNum(v)) return;
        var r = registrar({ cnpj: b.cnpj, banco: b.nome, fonte: 'ifdata', periodo: periodo,
                            metrica: m.id, valor: v, referencia: 'IF.data (automático)', auto: true }, true);
        if (r.ok) n++;
      });
    });
    salvar();
    return n;
  }

  /* --------------------------- conciliação ------------------------------- */

  /** Lê como percentual as unidades que já são percentuais. */
  function ehPercentual(metrica) {
    var m = PUB.METRICA_POR_ID[metrica];
    return !!m && (m.unidade === '%' || m.unidade === 'p.p.');
  }

  /**
   * Compara as fontes de uma célula (banco × período × métrica).
   * Devolve null quando menos de duas fontes publicaram o número — sem duas
   * observações não há divergência, e inventar uma seria ruído.
   */
  function compararCelula(cnpj, periodo, metrica) {
    var achados = [];
    PUB.FONTES.forEach(function (f) {
      var v = valor(cnpj, f.id, periodo, metrica);
      if (U.isNum(v)) achados.push({ fonte: f.id, valor: v });
    });
    if (achados.length < 2) {
      return achados.length ? { fontes: achados, comparavel: false } : null;
    }
    var vals = achados.map(function (a) { return a.valor; });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    var escala = Math.max.apply(null, vals.map(Math.abs)) || 1;
    var gapAbs = max - min;
    var gapRel = (gapAbs / escala) * 100;

    // Índices comparam-se em pontos percentuais; saldos, em variação relativa.
    var pp = ehPercentual(metrica);
    var medida = pp ? gapAbs : gapRel;
    var severidade = pp
      ? (gapAbs > 1 ? 'alta' : gapAbs > 0.25 ? 'media' : 'baixa')
      : (gapRel > 5 ? 'alta' : gapRel > 1 ? 'media' : 'baixa');

    return {
      fontes: achados, comparavel: true,
      max: max, min: min, gapAbs: gapAbs, gapRel: gapRel,
      medida: medida, unidadeGap: pp ? 'p.p.' : '%',
      severidade: severidade,
      maiorEm: achados.filter(function (a) { return a.valor === max; })[0].fonte,
      menorEm: achados.filter(function (a) { return a.valor === min; })[0].fonte
    };
  }

  /** Varre o escopo e devolve as divergências, da maior para a menor. */
  function divergencias(bancos, periodos, metricas, minimaSeveridade) {
    var ordem = { alta: 3, media: 2, baixa: 1 };
    var corte = ordem[minimaSeveridade || 'media'];
    var saida = [];
    bancos.forEach(function (b) {
      periodos.forEach(function (p) {
        metricas.forEach(function (mid) {
          var c = compararCelula(b.cnpj, p, mid);
          if (!c || !c.comparavel) return;
          if (ordem[c.severidade] < corte) return;
          saida.push({
            cnpj: b.cnpj, banco: b.nome, periodo: p, metrica: mid,
            nomeMetrica: PUB.METRICA_POR_ID[mid].nome,
            familia: PUB.METRICA_POR_ID[mid].familia,
            comparacao: c
          });
        });
      });
    });
    return saida.sort(function (a, b) {
      var d = (ordem[b.comparacao.severidade] - ordem[a.comparacao.severidade]);
      return d !== 0 ? d : b.comparacao.medida - a.comparacao.medida;
    });
  }

  /** Matriz banco × fonte: quantas métricas esperadas já foram preenchidas. */
  function cobertura(bancos, periodos, metricas) {
    return bancos.map(function (b) {
      var celulas = PUB.FONTES.map(function (f) {
        var esperadas = metricas.filter(function (mid) {
          return PUB.METRICA_POR_ID[mid].fontes.indexOf(f.id) >= 0;
        });
        var alvo = esperadas.length * periodos.length;
        var preenchidas = 0;
        esperadas.forEach(function (mid) {
          periodos.forEach(function (p) {
            if (U.isNum(valor(b.cnpj, f.id, p, mid))) preenchidas++;
          });
        });
        return { fonte: f.id, alvo: alvo, preenchidas: preenchidas,
                 pct: alvo ? (preenchidas / alvo) * 100 : null };
      });
      return { banco: b, celulas: celulas };
    });
  }

  /* --------------------------- importar / exportar ------------------------ */

  /** Lê o CSV do modelo. Aceita ';' ou ',' como separador. */
  function importarCSV(texto) {
    var limpo = String(texto || '').replace(/^﻿/, '').trim();
    if (!limpo) return { inseridos: 0, substituidos: 0, erros: ['arquivo vazio'] };
    var linhas = limpo.split(/\r?\n/);
    var sep = (linhas[0].match(/;/g) || []).length >= (linhas[0].match(/,/g) || []).length ? ';' : ',';

    function campos(linha) {
      var out = [], atual = '', aspas = false;
      for (var i = 0; i < linha.length; i++) {
        var c = linha[i];
        if (c === '"') {
          if (aspas && linha[i + 1] === '"') { atual += '"'; i++; }
          else aspas = !aspas;
        } else if (c === sep && !aspas) { out.push(atual); atual = ''; }
        else atual += c;
      }
      out.push(atual);
      return out.map(function (x) { return x.trim(); });
    }

    var cab = campos(linhas[0]).map(function (h) { return U.norm(h).replace(/ /g, ''); });
    var pos = {};
    PUB.COLUNAS_IMPORT.forEach(function (c) {
      pos[c.key] = cab.indexOf(U.norm(c.label).replace(/ /g, ''));
    });
    var faltando = ['cnpj', 'fonte', 'periodo', 'metrica', 'valor']
      .filter(function (k) { return pos[k] < 0; });
    if (faltando.length) {
      return { inseridos: 0, substituidos: 0,
               erros: ['faltam as colunas obrigatórias: ' + faltando.join(', ')] };
    }

    var inseridos = 0, substituidos = 0, erros = [];
    for (var i = 1; i < linhas.length; i++) {
      if (!linhas[i].trim()) continue;
      var f = campos(linhas[i]);
      var r = registrar({
        cnpj: f[pos.cnpj], banco: pos.banco >= 0 ? f[pos.banco] : '',
        fonte: f[pos.fonte], periodo: f[pos.periodo], metrica: f[pos.metrica],
        valor: f[pos.valor],
        referencia: pos.referencia >= 0 ? f[pos.referencia] : '',
        url: pos.url >= 0 ? f[pos.url] : ''
      }, true);
      if (!r.ok) { if (erros.length < 12) erros.push('linha ' + (i + 1) + ': ' + r.motivo); }
      else if (r.substituiu) substituidos++;
      else inseridos++;
    }
    salvar();
    return { inseridos: inseridos, substituidos: substituidos, erros: erros };
  }

  function exportarCSV() {
    var cab = PUB.COLUNAS_IMPORT.map(function (c) { return c.label; }).join(';');
    var linhas = dados.map(function (l) {
      return [l.cnpj, l.banco, l.fonte, l.periodo, l.metrica,
              String(l.valor).replace('.', ','), l.referencia, l.url]
        .map(function (v) {
          var t = String(v == null ? '' : v);
          return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
        }).join(';');
    });
    return '﻿' + [cab].concat(linhas).join('\r\n');
  }

  global.PST = {
    carregar: carregar, salvar: salvar, registrar: registrar, remover: remover, limpar: limpar,
    valor: valor, lancamento: lancamento, todos: todos, bancosComDados: bancosComDados,
    normalizarCnpj: normalizarCnpj, sincronizarIFData: sincronizarIFData,
    compararCelula: compararCelula, divergencias: divergencias, cobertura: cobertura,
    importarCSV: importarCSV, exportarCSV: exportarCSV
  };
})(window);

</script>
  <script>
/* ===== pdf-extract.js ===== */
/* pdf-extract.js — leitura de PDF no próprio navegador.
   Namespace global `PDFX`.

   O que faz: reconstrói as linhas do documento a partir das posições do texto,
   acha os números de cada linha e propõe, para cada métrica do catálogo, os
   valores encontrados ao lado de um rótulo conhecido.

   O que NÃO faz, de propósito: gravar sozinho. A extração propõe; quem lança é
   o analista, depois de ver a linha de onde o número saiu. Num banco, um número
   sem rastro não vale nada. */
(function (global) {
  'use strict';
  var U = global.U;

  /* Um import() dentro de script clássico resolve o caminho contra a URL do
     PRÓPRIO script, não da página — e este arquivo mora em assets/js/, o que
     produziria assets/js/assets/vendor/... Resolver contra document.baseURI dá
     uma URL absoluta e correta tanto na raiz quanto servido de uma subpasta. */
  function caminhoLib() {
    return new URL('assets/vendor/pdfjs/', document.baseURI).href;
  }

  var lib = null;

  /** Carrega o pdf.js embutido sob demanda (são ~1,8 MB). */
  function carregarLib() {
    if (lib) return Promise.resolve(lib);
    var base = caminhoLib();
    return import(base + 'pdf.min.mjs').then(function (mod) {
      mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      lib = mod;
      return lib;
    }).catch(function (e) {
      throw new Error('o leitor de PDF não pôde ser carregado de ' + base +
        ' (' + ((e && e.message) || e) + ').');
    });
  }

  function disponivel() {
    return typeof fetch === 'function' && typeof Promise !== 'undefined';
  }

  /* ------------------------- números em pt-BR --------------------------- */

  /* Aceita 1.234.567,89 · 15,80 · (1.234) negativo entre parênteses ·
     sinal antes ou depois · % e R$ colados. Rejeita datas e sequências que
     são claramente identificadores (CNPJ, códigos de conta). */
  var RE_NUMERO = /\(?-?\s?(?:\d{1,3}(?:\.\d{3})+|\d+)(?:,\d+)?\s?\)?%?/g;

  function interpretar(bruto) {
    var t = String(bruto).trim();
    var negativo = /^\(.*\)$/.test(t) || /^-/.test(t);
    var limpo = t.replace(/[()%\s-]/g, '');
    if (!limpo) return null;
    var n;
    if (/,/.test(limpo)) n = Number(limpo.replace(/\./g, '').replace(',', '.'));
    else if (/^\d{1,3}(\.\d{3})+$/.test(limpo)) n = Number(limpo.replace(/\./g, ''));
    else n = Number(limpo);
    if (!isFinite(n)) return null;
    return negativo ? -n : n;
  }

  /* Sequências que têm dígitos mas não são medida. Ficam mascaradas por espaços
     do mesmo tamanho, para que as posições do resto da linha não se desloquem. */
  var RUIDO = [
    /\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g,      // CNPJ
    /\d{3}\.\d{3}\.\d{3}-\d{2}/g,               // CPF
    /\d{1,2}\/\d{1,2}\/\d{2,4}/g,                // data
    /\b\d{1,2}\s*:\s*\d{2}\b/g,                 // hora
    /\([^)]*[A-Za-zÀ-ÿ][^)]*\)/g                  // "(1 dia, 99%)", "(12 meses)", "(CET1)"
  ];

  /* O último padrão não engole "(4.820.000)": parêntese só com dígitos é a
     notação contábil de negativo, e continua sendo lido como número. */

  function mascararRuido(texto) {
    var t = texto;
    RUIDO.forEach(function (re) {
      t = t.replace(re, function (achado) { return new Array(achado.length + 1).join(' '); });
    });
    return t;
  }

  /** Números de uma linha, com a posição em que aparecem. */
  function numerosDaLinha(textoOriginal) {
    var texto = mascararRuido(textoOriginal);
    var saida = [];
    var m;
    RE_NUMERO.lastIndex = 0;
    while ((m = RE_NUMERO.exec(texto)) !== null) {
      var bruto = m[0].trim();
      if (!/\d/.test(bruto)) continue;
      var v = interpretar(bruto);
      if (v === null) continue;
      // descarta o que quase certamente é identificador, não medida
      var soDigitos = bruto.replace(/\D/g, '');
      if (soDigitos.length >= 11 && !/[,.]/.test(bruto)) continue;
      saida.push({ bruto: bruto, valor: v, inicio: m.index, percentual: /%/.test(bruto) });
    }
    return saida;
  }

  /* ------------------------ leitura do documento ------------------------ */

  /**
   * Abre o PDF e devolve as páginas com as linhas reconstruídas.
   * As linhas vêm do agrupamento dos fragmentos de texto por coordenada
   * vertical: é o que transforma uma tabela em algo pesquisável.
   */
  function lerDocumento(arquivo, onProgresso) {
    return carregarLib().then(function (pdfjs) {
      return arquivo.arrayBuffer().then(function (buf) {
        return pdfjs.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
      });
    }).then(function (doc) {
      var paginas = [];
      function proxima(n) {
        if (n > doc.numPages) return Promise.resolve(paginas);
        if (onProgresso) onProgresso(n, doc.numPages);
        return doc.getPage(n)
          .then(function (pg) { return pg.getTextContent(); })
          .then(function (conteudo) {
            paginas.push({ numero: n, linhas: montarLinhas(conteudo.items) });
            return proxima(n + 1);
          });
      }
      return proxima(1).then(function () {
        return { nome: arquivo.name, paginas: paginas, totalPaginas: doc.numPages };
      });
    });
  }

  function montarLinhas(itens) {
    var porY = new Map();
    itens.forEach(function (it) {
      var s = String(it.str == null ? '' : it.str);
      if (!s.trim()) return;
      var x = it.transform[4], y = it.transform[5];
      var chave = Math.round(y / 3);           // tolerância vertical
      if (!porY.has(chave)) porY.set(chave, []);
      porY.get(chave).push({ str: s, x: x, largura: it.width || 0 });
    });

    var linhas = [];
    Array.from(porY.entries())
      .sort(function (a, b) { return b[0] - a[0]; })   // de cima para baixo
      .forEach(function (par) {
        var pedacos = par[1].sort(function (a, b) { return a.x - b.x; });
        var texto = '', anterior = null;
        pedacos.forEach(function (p) {
          if (anterior && p.x - (anterior.x + anterior.largura) > 1.2) texto += '  ';
          else if (anterior && !/\s$/.test(texto) && !/^\s/.test(p.str)) texto += '';
          texto += p.str;
          anterior = p;
        });
        texto = texto.replace(/\s{3,}/g, '  ').trim();
        if (texto) linhas.push({ y: par[0] * 3, texto: texto });
      });
    return linhas;
  }

  /* --------------------- data-base dentro do texto ---------------------- */

  var MESES = { janeiro: 3, marco: 3, mar: 3, junho: 6, jun: 6,
                setembro: 9, set: 9, dezembro: 12, dez: 12 };

  /** Tenta descobrir a data-base do documento pelo próprio texto. */
  function detectarPeriodo(doc) {
    var amostra = [];
    doc.paginas.slice(0, 4).forEach(function (p) {
      p.linhas.slice(0, 40).forEach(function (l) { amostra.push(U.norm(l.texto)); });
    });
    var texto = amostra.join(' | ');

    var m = texto.match(/(?:30|31)\s+de\s+(marco|junho|setembro|dezembro)\s+de\s+(\d{4})/);
    if (m) return String(m[2]) + String(MESES[m[1]]).padStart(2, '0');

    m = texto.match(/([1-4])\s*t\s*(\d{2,4})/);
    if (m) {
      var ano = m[2].length === 2 ? '20' + m[2] : m[2];
      return ano + String(Number(m[1]) * 3).padStart(2, '0');
    }
    m = texto.match(/(mar|jun|set|dez)[a-z]*\s*\/?\s*(\d{2,4})/);
    if (m) {
      var a = m[2].length === 2 ? '20' + m[2] : m[2];
      return a + String(MESES[m[1]]).padStart(2, '0');
    }
    return null;
  }

  /* --------------------------- candidatos ------------------------------- */

  /**
   * Para cada métrica com rótulo conhecido, procura linhas que o contenham e
   * devolve os números daquela linha como candidatos.
   * `limiteLinha` evita propor a partir de linhas longas demais, que costumam
   * ser texto corrido e não tabela.
   */
  function extrairCandidatos(doc, opcoes) {
    var o = opcoes || {};
    var metricas = global.PUB.metricasProcuraveis();
    var limiteLinha = o.limiteLinha || 220;
    var porMetrica = new Map();

    doc.paginas.forEach(function (pg) {
      pg.linhas.forEach(function (linha) {
        if (linha.texto.length > limiteLinha) return;
        var norm = U.norm(linha.texto);

        /* Rótulos se contêm: "capital principal" casa também com a linha
           "índice de capital principal". Fica só a métrica cujo rótulo casou
           mais longo — o mais específico é o que descreve aquela linha. */
        var casados = [];
        metricas.forEach(function (m) {
          var melhor = null;
          m.rotulos.forEach(function (r) {
            if (norm.indexOf(r) >= 0 && (!melhor || r.length > melhor.length)) melhor = r;
          });
          if (melhor) casados.push({ metrica: m, rotulo: melhor });
        });
        if (!casados.length) return;
        var maior = Math.max.apply(null, casados.map(function (c) { return c.rotulo.length; }));
        casados = casados.filter(function (c) { return c.rotulo.length === maior; });

        var numeros = numerosDaLinha(linha.texto);
        if (!numeros.length) return;

        casados.forEach(function (c) {
          /* Números depois do rótulo vêm primeiro — numa tabela é ali que está
             o valor da linha. Os anteriores entram no fim em vez de sumirem: em
             texto corrido ("2 exceções de backtesting em 250 dias") o número
             certo é justamente o que vem antes. */
          var pos = norm.indexOf(c.rotulo);
          var depois = numeros.filter(function (n) { return n.inicio >= pos; });
          var antes = numeros.filter(function (n) { return n.inicio < pos; });
          if (!porMetrica.has(c.metrica.id)) {
            porMetrica.set(c.metrica.id, { metrica: c.metrica, ocorrencias: [] });
          }
          var alvo = porMetrica.get(c.metrica.id);
          if (alvo.ocorrencias.length < 6) {
            alvo.ocorrencias.push({
              pagina: pg.numero, texto: linha.texto, rotulo: c.rotulo,
              numeros: depois.concat(antes).slice(0, 8)
            });
          }
        });
      });
    });

    var fam = global.PUB.FAMILIAS.map(function (f) { return f.id; });
    return Array.from(porMetrica.values()).sort(function (a, b) {
      return fam.indexOf(a.metrica.familia) - fam.indexOf(b.metrica.familia);
    });
  }

  /** Busca livre: linhas que contenham o termo, com os números que trazem. */
  function procurar(doc, termo) {
    var q = U.norm(termo);
    if (q.length < 3) return [];
    var saida = [];
    doc.paginas.forEach(function (pg) {
      pg.linhas.forEach(function (linha) {
        if (U.norm(linha.texto).indexOf(q) < 0) return;
        saida.push({ pagina: pg.numero, texto: linha.texto, numeros: numerosDaLinha(linha.texto) });
      });
    });
    return saida.slice(0, 60);
  }

  global.PDFX = {
    disponivel: disponivel, carregarLib: carregarLib, lerDocumento: lerDocumento,
    numerosDaLinha: numerosDaLinha, interpretar: interpretar,
    detectarPeriodo: detectarPeriodo, extrairCandidatos: extrairCandidatos, procurar: procurar
  };
})(window);

</script>
  <script>
/* ===== views-publicacoes.js ===== */
/* views-publicacoes.js — módulo Publicações do Risk Bench.
   Conciliação entre BR GAAP, IFRS, Pilar 3, 20-F e a linha de base do IF.data. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI, ST = global.ST, CH = global.CH, API = global.API,
      TBL = global.TBL, CAT = global.CAT, VW = global.VW, PUB = global.PUB, PST = global.PST;

  /* ======================== apoio comum ao módulo ======================== */

  function corDaFonte(id) {
    var f = PUB.FONTE_POR_ID[id];
    return f ? 'var(--series-' + f.serie + ')' : 'var(--text-muted)';
  }

  function periodos() { return PUB.periodosDoEscopo(ST.estado.anoMes); }

  /** Bancos do escopo: S1/S2 do IF.data, mais qualquer um que já tenha lançamento. */
  function bancosDoEscopo() {
    return VW.carregar({ naoGuardar: true }).then(function (ds) {
      var lista = ds.rows.map(function (r) {
        return { cnpj: PST.normalizarCnpj(r.__id), nome: r.__nome,
                 segmento: r.__segmento || null, doIFData: true, row: r };
      });
      return juntarComLancados(lista);
    }).catch(function () { return juntarComLancados([]); });
  }

  function juntarComLancados(lista) {
    var vistos = {};
    lista.forEach(function (b) { vistos[b.cnpj] = true; });
    PST.bancosComDados().forEach(function (b) {
      if (!vistos[b.cnpj]) lista.push({ cnpj: b.cnpj, nome: b.nome, segmento: null, doIFData: false });
    });
    return lista.sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome), 'pt-BR'); });
  }

  function avisoFontes() {
    return UI.nota([
      U.el('div', {}, [
        U.el('strong', { text: 'De onde vêm os números. ' }),
        U.el('span', { text: 'O IF.data é preenchido automaticamente. BR GAAP, IFRS, Pilar 3 e 20-F ' +
          'são PDFs e planilhas publicados pelos bancos, pela CVM e pela SEC — não há API que os ' +
          'sirva, então entram por importação de planilha ou lançamento manual. O formato de ' +
          'importação é o contrato: um extrator automático, no futuro, só precisa gerar esse CSV.' })
      ])
    ]);
  }

  function seletorBanco(bancos, atual, onChange) {
    return UI.seletor(bancos.map(function (b) {
      return { value: b.cnpj, label: b.nome + (b.segmento ? '  (' + b.segmento + ')' : '') };
    }), atual, onChange, { style: 'min-width:260px;max-width:420px' });
  }

  function seletorMetrica(atual, onChange) {
    var opcoes = [];
    PUB.FAMILIAS.forEach(function (f) {
      PUB.metricasDaFamilia(f.id).forEach(function (m) {
        opcoes.push({ value: m.id, label: f.nome + ' · ' + m.nome });
      });
    });
    return UI.seletor(opcoes, atual, onChange, { style: 'min-width:280px;max-width:440px' });
  }

  function fmtMetrica(m) {
    return function (v) {
      if (!U.isNum(v)) return '–';
      if (m.unidade === 'R$ mil') return U.compact(v, 1);
      return U.fmt(v, m.decimais) + (m.unidade === 'nº' ? '' : ' ' + m.unidade);
    };
  }

  /* ===================================================================
     Tela 1 — Cobertura
     =================================================================== */

  VW.registrar({
    id: 'pub-cobertura', modulo: 'publicacoes', titulo: 'Cobertura',
    descricao: 'O que já foi levantado de cada fonte, por banco.',
    montar: function (node) {
      var local = { familia: '', carregando: false };

      function render() {
        var atual = VW.novaGeracao(node);
        VW.blocoCarregando(node, 'Montando o escopo S1/S2…');
        bancosDoEscopo().then(function (bancos) { if (atual()) pintar(bancos); })
          .catch(function (e) { if (atual()) VW.blocoErro(node, e); });
      }

      function pintar(bancos) {
        U.clear(node);
        node.appendChild(avisoFontes());

        var ps = periodos();
        var metricas = (local.familia ? PUB.metricasDaFamilia(local.familia) : PUB.METRICAS)
          .map(function (m) { return m.id; });

        var barra = U.el('div', { class: 'filterbar' });
        barra.appendChild(UI.campo('Família de indicadores', UI.seletor(
          [{ value: '', label: 'Todas as famílias' }].concat(PUB.FAMILIAS.map(function (f) {
            return { value: f.id, label: f.nome };
          })), local.familia, function (v) { local.familia = v; pintar(bancos); })));
        barra.appendChild(UI.campo('Janela', U.el('div', { class: 'small muted',
          text: U.periodLabel(ps[ps.length - 1]) + ' a ' + U.periodLabel(ps[0]) + ' · 16 trimestres' })));
        barra.appendChild(U.el('div', { class: 'filterbar__actions' }, [
          U.el('button', { class: 'btn btn--primary', text: 'Espelhar IF.data no trimestre atual',
            title: 'Preenche a coluna IF.data com os indicadores equivalentes já calculados',
            onclick: function () { espelhar(bancos); } })
        ]));
        node.appendChild(barra);

        var todos = PST.todos();
        var noEscopo = todos.filter(function (l) { return metricas.indexOf(l.metrica) >= 0; });
        var manuais = noEscopo.filter(function (l) { return l.fonte !== 'ifdata'; });
        var cob = PST.cobertura(bancos, ps, metricas);
        var alvoTotal = 0, feitoTotal = 0;
        cob.forEach(function (linha) {
          linha.celulas.forEach(function (c) {
            if (c.fonte === 'ifdata') return;
            alvoTotal += c.alvo; feitoTotal += c.preenchidas;
          });
        });

        node.appendChild(VW.faixaStats([
          { label: 'Bancos no escopo', valor: U.fmt(bancos.length, 0),
            nota: 'S1 e S2 do IF.data, mais os já lançados' },
          { label: 'Lançamentos das publicações', valor: U.fmt(manuais.length, 0),
            nota: 'fora o espelho automático do IF.data' },
          { label: 'Cobertura das quatro fontes', valor: U.pct(alvoTotal ? (feitoTotal / alvoTotal) * 100 : 0, 1),
            nota: U.fmt(feitoTotal, 0) + ' de ' + U.fmt(alvoTotal, 0) + ' células esperadas' },
          { label: 'Espelho do IF.data', valor: U.fmt(noEscopo.length - manuais.length, 0),
            nota: 'preenchido automaticamente' }
        ]));

        var cartao = UI.card({ titulo: 'Matriz de cobertura',
          sub: 'Quantas das células esperadas (métrica × trimestre) já têm número, por fonte.' });
        var matriz = U.el('div', { class: 'matriz' });
        var tab = U.el('table');
        var thead = U.el('thead');
        var trh = U.el('tr', {}, [U.el('th', { class: 'banco', text: 'Instituição', scope: 'col' })]);
        PUB.FONTES.forEach(function (f) {
          trh.appendChild(U.el('th', { text: f.curto, title: f.nome, scope: 'col' }));
        });
        thead.appendChild(trh);
        var tbody = U.el('tbody');
        cob.forEach(function (linha) {
          var tr = U.el('tr', {}, [U.el('td', { class: 'banco' }, [
            U.el('span', { text: U.truncate(linha.banco.nome, 34), title: linha.banco.nome }),
            linha.banco.segmento
              ? U.el('span', { class: 'familia-chip', style: 'margin-left:6px', text: linha.banco.segmento })
              : null
          ])]);
          linha.celulas.forEach(function (c) {
            var classe = !c.alvo ? 'cob--vazia'
              : c.preenchidas === 0 ? 'cob--vazia'
              : c.preenchidas >= c.alvo ? 'cob--cheia' : 'cob--parcial';
            tr.appendChild(U.el('td', { class: 'celula' }, [
              U.el('span', { class: 'cob ' + classe,
                title: c.preenchidas + ' de ' + c.alvo + ' células',
                text: c.alvo ? c.preenchidas + '/' + c.alvo : '—' })
            ]));
          });
          tbody.appendChild(tr);
        });
        tab.appendChild(thead); tab.appendChild(tbody);
        matriz.appendChild(tab);
        cartao.corpo.appendChild(matriz);
        node.appendChild(cartao.node);

        var legenda = UI.card({ titulo: 'O que cada fonte costuma trazer' });
        var lista = U.el('div', { class: 'stack' });
        PUB.FONTES.forEach(function (f) {
          lista.appendChild(U.el('div', { class: 'div-item' }, [
            U.el('div', {}, [
              U.el('div', { class: 'div-item__metrica' }, [
                U.el('span', { class: 'legend__swatch', style: 'background:' + corDaFonte(f.id) +
                  ';display:inline-block;margin-right:7px' }),
                U.el('span', { text: f.nome })
              ]),
              U.el('div', { class: 'div-item__contexto', text: f.desc })
            ]),
            U.el('div', { class: 'div-item__valor' }, [
              U.el('div', { text: PUB.metricasDaFonte(f.id).length + ' métricas' }),
              U.el('div', { class: 'small muted', text: f.automatica ? 'automática' : 'importação' })
            ])
          ]));
        });
        legenda.corpo.appendChild(lista);
        node.appendChild(legenda.node);
      }

      function espelhar(bancos) {
        VW.carregar().then(function (ds) {
          var ctxCalc = { anoMes: ds.anoMes, anualizar: ST.estado.anualizar };
          var porId = VW.linhasPorId(ds);
          var n = PST.sincronizarIFData(bancos, ds.anoMes, function (banco, indicadorId) {
            var linha = porId.get(banco.cnpj) || (banco.row || null);
            if (!linha) return null;
            var ind = CAT.calcIndicadores(linha, ds.campos, ctxCalc);
            if (U.isNum(ind[indicadorId])) return ind[indicadorId];
            var campo = ds.campos[indicadorId];
            return campo ? VW.valor(linha, campo) : null;
          });
          UI.toast(n + ' valores espelhados do IF.data em ' + U.periodLabel(ds.anoMes) + '.',
                   n ? 'good' : 'warn');
          render();
        }).catch(function (e) {
          UI.toast('Não foi possível ler o IF.data: ' + e.message, 'bad');
        });
      }

      render();
      return { atualizar: render };
    }
  });

  /* ===================================================================
     Tela 2 — Comparativo entre fontes
     =================================================================== */

  VW.registrar({
    id: 'pub-comparativo', modulo: 'publicacoes', titulo: 'Comparativo',
    descricao: 'Uma métrica, um banco, as cinco fontes lado a lado ao longo de 16 trimestres.',
    montar: function (node) {
      var local = { cnpj: null, metrica: 'basileia' };

      function render() {
        var atual = VW.novaGeracao(node);
        VW.blocoCarregando(node, 'Montando o escopo S1/S2…');
        bancosDoEscopo().then(function (bancos) { if (atual()) pintar(bancos); })
          .catch(function (e) { if (atual()) VW.blocoErro(node, e); });
      }

      function pintar(bancos) {
        U.clear(node);
        if (!bancos.length) {
          node.appendChild(UI.vazio('Nenhum banco no escopo',
            'Carregue um período no módulo IF.data ou lance dados na tela Lançamentos.'));
          return;
        }
        if (!local.cnpj || !bancos.some(function (b) { return b.cnpj === local.cnpj; })) {
          local.cnpj = bancos[0].cnpj;
        }
        var banco = bancos.find(function (b) { return b.cnpj === local.cnpj; });
        var m = PUB.METRICA_POR_ID[local.metrica];
        var ps = periodos().slice().reverse();          // cronológico
        var fmt = fmtMetrica(m);

        var barra = U.el('div', { class: 'filterbar' });
        barra.appendChild(UI.campo('Instituição',
          seletorBanco(bancos, local.cnpj, function (v) { local.cnpj = v; pintar(bancos); }), 'grow'));
        barra.appendChild(UI.campo('Métrica',
          seletorMetrica(local.metrica, function (v) { local.metrica = v; pintar(bancos); }), 'grow'));
        node.appendChild(barra);

        node.appendChild(UI.nota(m.definicao + '  Fontes que costumam publicar: ' +
          m.fontes.map(function (f) { return PUB.FONTE_POR_ID[f].curto; }).join(', ') + '.'));

        var series = PUB.FONTES.map(function (f) {
          return {
            key: f.id, label: f.curto, color: corDaFonte(f.id),
            values: ps.map(function (p) { return PST.valor(banco.cnpj, f.id, p, m.id); })
          };
        }).filter(function (s) { return s.values.some(U.isNum); });

        if (!series.length) {
          node.appendChild(UI.vazio('Sem números para esta combinação',
            'Lance ou importe os valores de ' + m.nome + ' para ' + banco.nome + '.'));
          node.appendChild(U.el('div', { class: 'row', style: 'justify-content:center' }, [

          { rotulo: 'CVM', url: buscaWeb(nome + ' site:rad.cvm.gov.br informações trimestrais') }
        ];
        return U.el('div', { class: 'fonte-card' }, [
          U.el('div', { class: 'fonte-card__nome' }, [
            U.el('span', { text: nome }),
            b.segmento ? U.el('span', { class: 'familia-chip', style: 'margin-left:8px', text: b.segmento }) : null
          ]),
          U.el('div', { class: 'small muted', text: 'CNPJ base ' + b.cnpj }),
          U.el('div', { class: 'fonte-card__links' }, links.map(function (l) {
            return U.el('a', { class: 'fonte-link', href: l.url, target: '_blank',
                               rel: 'noopener noreferrer', text: l.rotulo });
          }))
        ]);
      }

      render();
      return { atualizar: render };
    }
  });
})(window);

  <script>
/* ===== views-pdf.js ===== */
/* views-pdf.js — tela "Importar PDF" do módulo Publicações.
   A extração propõe; o analista confirma. Nenhum número entra na base sem que
   alguém tenha visto a linha de onde ele saiu. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI, ST = global.ST, VW = global.VW,
      PUB = global.PUB, PST = global.PST, PDFX = global.PDFX, TBL = global.TBL;

  VW.registrar({
    id: 'pub-pdf', modulo: 'publicacoes', titulo: 'Importar PDF',
    descricao: 'Abra o Pilar 3, as demonstrações ou o 20-F e extraia os números direto do documento.',
    montar: function (node) {
      var local = {
        cnpj: null, fonte: 'pilar3', periodo: null,
        doc: null, candidatos: null, selecao: {}, carregando: false, progresso: '',
        termoBusca: ''
      };

      function render() {
        var atual = VW.novaGeracao(node);
        VW.blocoCarregando(node, 'Montando o escopo S1/S2…');
        bancos().then(function (lista) { if (atual()) pintar(lista); })
          .catch(function () { if (atual()) pintar([]); });
      }

      function bancos() {
        return VW.carregar({ naoGuardar: true }).then(function (ds) {
          return ds.rows.map(function (r) {
            return { cnpj: PST.normalizarCnpj(r.__id), nome: r.__nome, segmento: r.__segmento };
          });
        }).catch(function () {
          return PST.bancosComDados().map(function (b) {
            return { cnpj: b.cnpj, nome: b.nome, segmento: null };
          });
        });
      }

      function pintar(lista) {
        U.clear(node);

        node.appendChild(UI.nota('A leitura acontece inteiramente no seu navegador: o arquivo não ' +
          'sai do aparelho e não passa por servidor nenhum. O sistema reconstrói as linhas do PDF, ' +
          'acha os rótulos do catálogo e propõe os números daquela linha — você confere e lança. ' +
          'Documentos digitalizados como imagem não têm texto para ler e não funcionam aqui.'));

        if (!lista.length) {
          node.appendChild(UI.vazio('Nenhum banco no escopo',
            'Carregue um período no módulo IF.data para montar a lista de S1 e S2.'));
          return;
        }
        if (!local.cnpj || !lista.some(function (b) { return b.cnpj === local.cnpj; })) {
          local.cnpj = lista[0].cnpj;
        }
        if (!local.periodo) local.periodo = PUB.periodosDoEscopo(ST.estado.anoMes)[0];

        /* ---------------------- contexto do lançamento -------------------- */
        var barra = U.el('div', { class: 'filterbar' });
        barra.appendChild(UI.campo('Instituição', UI.seletor(
          lista.map(function (b) {
            return { value: b.cnpj, label: b.nome + (b.segmento ? '  (' + b.segmento + ')' : '') };
          }), local.cnpj, function (v) { local.cnpj = v; }, { style: 'min-width:250px;max-width:400px' }), 'grow'));
        barra.appendChild(UI.campo('Fonte', UI.seletor(
          PUB.FONTES.filter(function (f) { return !f.automatica; })
            .map(function (f) { return { value: f.id, label: f.nome }; }),
          local.fonte, function (v) { local.fonte = v; }, { style: 'max-width:320px' })));
        barra.appendChild(UI.campo('Trimestre', UI.seletor(
          PUB.periodosDoEscopo(ST.estado.anoMes).map(function (p) {
            return { value: p, label: U.periodLabel(p) };
          }), local.periodo, function (v) { local.periodo = v; })));
        node.appendChild(barra);

        /* --------------------------- o arquivo ---------------------------- */
        var entrada = U.el('input', { type: 'file', accept: '.pdf,application/pdf' });
        entrada.addEventListener('change', function () {
          var f = entrada.files && entrada.files[0];
          if (f) processar(f, lista);
        });

        var zona = U.el('div', {
          style: 'border:1px dashed var(--border-strong);border-radius:var(--r-md);' +
                 'padding:26px;text-align:center;color:var(--text-secondary);cursor:pointer',
          onclick: function () { entrada.click(); }
        }, [
          U.el('div', { style: 'font-size:14px;font-weight:600;color:var(--text-primary)',
                        text: 'Arraste o PDF aqui, ou toque para escolher' }),
          U.el('div', { class: 'small muted', style: 'margin-top:4px',
                        text: 'Pilar 3, demonstrações trimestrais ou 20-F' })
        ]);
        ['dragenter', 'dragover'].forEach(function (ev) {
          zona.addEventListener(ev, function (e) {
            e.preventDefault(); zona.style.borderColor = 'var(--accent)';
          });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
          zona.addEventListener(ev, function (e) {
            e.preventDefault(); zona.style.borderColor = 'var(--border-strong)';
          });
        });
        zona.addEventListener('drop', function (e) {
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) processar(f, lista);
        });

        var cArq = UI.card({ titulo: 'Documento',
          sub: local.doc ? local.doc.nome + ' · ' + local.doc.totalPaginas + ' páginas' : 'Nenhum aberto' });
        cArq.corpo.appendChild(U.el('div', { class: 'stack' }, [zona, entrada]));
        entrada.style.display = 'none';
        node.appendChild(cArq.node);

        if (local.carregando) {
          node.appendChild(UI.carregando(local.progresso || 'Lendo o documento…'));
          return;
        }
        if (local.erro) {
          node.appendChild(UI.nota('Não foi possível ler o PDF: ' + local.erro +
            ' Se o documento for digitalizado (imagem), não há texto para extrair — ' +
            'nesse caso o lançamento tem de ser manual.', 'bad'));
        }
        if (!local.candidatos) return;

        /* ------------------------- o que foi achado ------------------------ */
        var achados = local.candidatos;
        var selecionados = Object.keys(local.selecao).length;

        node.appendChild(VW.faixaStats([
          { label: 'Métricas reconhecidas', valor: U.fmt(achados.length, 0),
            nota: 'de ' + PUB.metricasProcuraveis().length + ' que o extrator procura' },
          { label: 'Selecionadas para lançar', valor: U.fmt(selecionados, 0),
            nota: 'confira cada uma antes de gravar' },
          { label: 'Páginas lidas', valor: U.fmt(local.doc.totalPaginas, 0), nota: local.doc.nome },
          local.periodoDetectado
            ? { label: 'Data-base detectada', valor: U.periodLabel(local.periodoDetectado),
                nota: local.periodoDetectado === local.periodo ? 'confere com o trimestre escolhido'
                                                              : 'diferente do trimestre escolhido' }
            : { label: 'Data-base', valor: '–', nota: 'não identificada no texto' }
        ]));

        if (!achados.length) {
          node.appendChild(UI.vazio('Nenhum rótulo do catálogo foi encontrado',
            'Use a busca livre abaixo para localizar o número pelo nome que este banco usa.'));
        }

        var cAch = UI.card({ titulo: 'Valores propostos',
          sub: 'Cada bloco mostra a linha de onde o número saiu. Toque no número correto — ' +
               'tabelas trazem vários trimestres na mesma linha.' });
        cAch.tools.appendChild(U.el('button', {
          class: 'btn btn--primary', text: 'Lançar ' + selecionados + ' selecionados',
          disabled: !selecionados, onclick: function () { lancar(lista); }
        }));

        achados.forEach(function (a) {
          var m = a.metrica;
          var escolha = local.selecao[m.id];
          var bloco = U.el('div', { class: 'div-item' + (escolha ? ' div-item--media' : ' div-item--baixa'),
                                    style: 'grid-template-columns:1fr' });
          bloco.appendChild(U.el('div', { class: 'row', style: 'justify-content:space-between' }, [
            U.el('div', {}, [
              U.el('span', { class: 'div-item__metrica', text: m.nome }),
              U.el('span', { class: 'familia-chip', style: 'margin-left:8px',
                text: (PUB.FAMILIAS.find(function (f) { return f.id === m.familia; }) || {}).nome })
            ]),
            escolha
              ? U.el('span', { class: 'div-item__valor' }, [
                  U.el('span', { class: 'div-item__gap',
                    text: U.fmt(escolha.valor, m.decimais) + ' ' + m.unidade }),
                  U.el('button', { class: 'btn btn--sm btn--ghost', text: 'limpar',
                    onclick: function () { delete local.selecao[m.id]; pintar(lista); } })
                ])
              : U.el('span', { class: 'small muted', text: 'nada escolhido' })
          ]));

          a.ocorrencias.forEach(function (oc) {
            var linha = U.el('div', { style: 'margin-top:8px' });
            linha.appendChild(U.el('div', { class: 'small muted',
              text: 'pág. ' + oc.pagina + ' · ' + U.truncate(oc.texto, 150) }));
            var chips = U.el('div', { class: 'row row--tight', style: 'margin-top:4px' });
            oc.numeros.forEach(function (n) {
              var ativo = escolha && escolha.valor === n.valor && escolha.pagina === oc.pagina;
              chips.appendChild(U.el('button', {
                class: 'btn btn--sm' + (ativo ? ' btn--primary' : ''),
                text: n.bruto,
                onclick: function () {
                  local.selecao[m.id] = { valor: n.valor, pagina: oc.pagina, texto: oc.texto };
                  pintar(lista);
                }
              }));
            });
            linha.appendChild(chips);
            bloco.appendChild(linha);
          });
          cAch.corpo.appendChild(bloco);
        });
        node.appendChild(cAch.node);

        /* --------------------------- busca livre --------------------------- */
        var cBusca = UI.card({ titulo: 'Busca livre no documento',
          sub: 'Para achar o número pelo nome que este banco usa, quando o rótulo não está no catálogo.' });
        var campo = U.el('input', { type: 'search', value: local.termoBusca,
          placeholder: 'ex.: razão de alavancagem', style: 'min-width:260px' });
        var saida = U.el('div', { style: 'margin-top:10px' });
        function buscar() {
          local.termoBusca = campo.value;
          U.clear(saida);
          var res = PDFX.procurar(local.doc, campo.value);
          if (!campo.value.trim()) return;
          if (!res.length) {
            saida.appendChild(U.el('div', { class: 'small muted', text: 'Nenhuma linha com esse termo.' }));
            return;
          }
          TBL.render(saida, {
            columns: [
              { key: 'pagina', label: 'Pág.', tipo: 'num', decimais: 0, largura: 60 },
              { key: 'texto', label: 'Linha', sticky: true, largura: 520 },
              { key: 'numeros', label: 'Números encontrados', largura: 240 }
            ],
            rows: res.map(function (r) {
              return { pagina: r.pagina, texto: r.texto,
                       numeros: r.numeros.map(function (n) { return n.bruto; }).join('   ') };
            }),
            busca: false, maxLinhas: 30, nomeArquivo: 'busca-pdf'
          });
        }
        campo.addEventListener('input', U.debounce(buscar, 220));
        cBusca.corpo.appendChild(U.el('div', { class: 'stack' }, [campo, saida]));
        if (local.termoBusca) buscar();
        node.appendChild(cBusca.node);
      }

      function processar(arquivo, lista) {
        local.carregando = true; local.erro = null;
        local.candidatos = null; local.selecao = {};
        local.progresso = 'Abrindo ' + arquivo.name + '…';
        pintar(lista);

        PDFX.lerDocumento(arquivo, function (n, total) {
          local.progresso = 'Lendo página ' + n + ' de ' + total + '…';
          var alvo = node.querySelector('.loading span');
          if (alvo) alvo.textContent = local.progresso;
        }).then(function (doc) {
          local.doc = doc;
          local.candidatos = PDFX.extrairCandidatos(doc);
          local.periodoDetectado = PDFX.detectarPeriodo(doc);
          if (local.periodoDetectado) local.periodo = local.periodoDetectado;
          local.carregando = false;
          pintar(lista);
          UI.toast(local.candidatos.length + ' métricas reconhecidas em ' + doc.totalPaginas + ' páginas.',
                   local.candidatos.length ? 'good' : 'warn');
        }).catch(function (e) {
          local.carregando = false;
          local.erro = (e && e.message) || String(e);
          pintar(lista);
        });
      }

      function lancar(lista) {
        var banco = lista.find(function (b) { return b.cnpj === local.cnpj; });
        var ok = 0, falhas = [];
        Object.keys(local.selecao).forEach(function (metricaId) {
          var esc = local.selecao[metricaId];
          var r = PST.registrar({
            cnpj: local.cnpj, banco: banco ? banco.nome : '',
            fonte: local.fonte, periodo: local.periodo, metrica: metricaId,
            valor: esc.valor,
            referencia: (local.doc ? local.doc.nome + ', ' : '') + 'pág. ' + esc.pagina
          });
          if (r.ok) ok++; else falhas.push(metricaId + ': ' + r.motivo);
        });
        UI.toast(ok + ' valores lançados' + (falhas.length ? ', ' + falhas.length + ' recusados.' : '.'),
                 falhas.length ? 'warn' : 'good');
        if (falhas.length) console.warn(falhas.join('\n'));
        local.selecao = {};
        pintar(lista);
      }

      render();
      return { atualizar: render };
    }
  });
})(window);

</script>
  <script>
/* ===== app.js ===== */
/* app.js — inicialização, barra de filtros global e navegação entre telas. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI, ST = global.ST, API = global.API,
      CAT = global.CAT, VW = global.VW, CH = global.CH;

  var instancias = {};
  var telaAtual = null;
  var refs = {};

  /* ------------------------------- módulos --------------------------------- */

  var MODULOS = [
    { id: 'ifdata', nome: 'IF.data',
      sub: 'Dados do Banco Central · bancos S1 e S2' },
    { id: 'publicacoes', nome: 'Publicações',
      sub: 'BR GAAP · IFRS · Pilar 3 · 20-F — conciliação entre fontes' }
  ];

  function moduloAtual() { return ST.estado.modulo || 'ifdata'; }

  function redesenharGraficos() {
    U.$$('.chart').forEach(function (c) { if (c.__redraw) c.__redraw(); });
  }

  /* ------------------------------ barra superior --------------------------- */

  function montarTopo() {
    var topo = U.$('#topbar');
    U.clear(topo);
    refs.brandSub = U.el('span', { class: 'brand__sub', text: '' });
    topo.appendChild(U.el('div', { class: 'brand' }, [
      U.el('span', { class: 'brand__mark', text: 'Risk Bench' }),
      refs.brandSub
    ]));
    topo.appendChild(U.el('div', { class: 'topbar__spacer' }));

    var ferramentas = U.el('div', { class: 'topbar__tools' });
    ferramentas.appendChild(UI.segmentado(
      MODULOS.map(function (m) { return { label: m.nome, value: m.id, hint: m.sub }; }),
      moduloAtual(), trocarModulo));

    refs.badge = U.el('span', { class: 'badge', text: '—' });
    ferramentas.appendChild(refs.badge);
    if (!global.IFDATA_FORCAR_DEMO) {
      ferramentas.appendChild(UI.segmentado([
        { label: 'API do BCB', value: 'live', hint: 'Consulta olinda.bcb.gov.br em tempo real' },
        { label: 'Demonstração', value: 'demo', hint: 'Dados sintéticos, sem rede' }
      ], ST.estado.modo === 'demo' ? 'demo' : 'live', definirModo));
    }
    topo.appendChild(ferramentas);
    atualizarBadge();
    atualizarSubtitulo();
  }

  function atualizarSubtitulo() {
    if (!refs.brandSub) return;
    var m = MODULOS.find(function (x) { return x.id === moduloAtual(); });
    refs.brandSub.textContent = m ? m.sub : '';
  }

  function trocarModulo(id) {
    if (id === moduloAtual()) return;
    ST.set({ modulo: id });
    ST.salvarPrefs();
    atualizarSubtitulo();
    montarFiltros();
    montarAbas();
    irPara((VW.todas(id)[0] || {}).id);
  }

  function atualizarBadge() {
    if (!refs.badge) return;
    var demo = ST.estado.modo === 'demo';
    refs.badge.className = 'badge ' + (demo ? 'badge--demo' : 'badge--live');
    refs.badge.textContent = demo ? 'dados sintéticos' : 'dados do BCB';
  }

  function definirModo(modo) {
    ST.set({ modo: modo });
    API.configurar({ modo: modo });
    ST.salvarPrefs();
    atualizarBadge();
    recarregar();                       // a tela não espera a descoberta da lista
    carregarRelatorios().then(function (trocou) { if (trocou) recarregar(); });
  }

  /* ------------------------------ filtros globais --------------------------- */

  function montarFiltros() {
    var barra = U.$('#filtros');
    U.clear(barra);

    // O módulo de publicações tem seus próprios recortes, dentro de cada tela.
    barra.hidden = moduloAtual() !== 'ifdata';
    if (barra.hidden) return;

    refs.selPeriodo = UI.seletor(
      U.allPeriods(2000).map(function (p) { return { value: p, label: U.periodLabel(p) }; }),
      ST.estado.anoMes,
      function (v) { ST.set({ anoMes: v }); ST.salvarPrefs(); recarregar(); });
    barra.appendChild(UI.campo('Data-base', refs.selPeriodo));

    refs.selTipo = UI.seletor(
      CAT.TIPOS_INSTITUICAO.map(function (t) { return { value: String(t.id), label: t.curto + ' — ' + t.nome }; }),
      String(ST.estado.tipo),
      function (v) {
        ST.set({ tipo: Number(v) });
        ST.salvarPrefs();
        recarregar();
        carregarRelatorios().then(function (trocou) { if (trocou) recarregar(); });
      }, { style: 'max-width:340px' });
    barra.appendChild(UI.campo('Tipo de instituição', refs.selTipo));

    refs.selRelatorio = UI.seletor([{ value: ST.estado.relatorio, label: 'Carregando…' }],
      ST.estado.relatorio,
      function (v) { ST.set({ relatorio: v }); ST.salvarPrefs(); recarregar(); },
      { style: 'min-width:280px;max-width:420px' });
    barra.appendChild(UI.campo('Relatório', refs.selRelatorio, 'grow'));

    refs.selEscala = UI.seletor(VW.ESCALAS, String(ST.estado.escala || 1), function (v) {
      ST.set({ escala: Number(v) }); recarregar();
    }, { style: 'max-width:200px' });
    barra.appendChild(UI.campo('Escala dos valores', refs.selEscala));

    barra.appendChild(U.el('div', { class: 'filterbar__actions' }, [
      UI.alternador('Escopo S1/S2', ST.estado.escopoS1S2 !== false, function (v) {
        ST.set({ escopoS1S2: v }); ST.salvarPrefs(); recarregar();
      }, 'Restringe a análise aos segmentos prudenciais S1 e S2, conforme a Segmentação do BCB.'),
      UI.alternador('Anualizar resultados', ST.estado.anualizar, function (v) {
        ST.set({ anualizar: v }); ST.salvarPrefs(); recarregar();
      }, 'A DRE do IF.data é acumulada no ano: marque para converter o resultado em base anual (×12/mês).'),
      U.el('button', { class: 'btn', text: 'Atualizar', title: 'Refaz a consulta ignorando o cache',
        onclick: function () { API.limparCache(); VW.reiniciarSegmentos(); recarregar(); } })
    ]));
  }

  /** Descobre a lista de relatórios em segundo plano.
      Resolve com `true` quando a descoberta trocou o relatório selecionado —
      só nesse caso vale recarregar a tela. */
  function carregarRelatorios() {
    return API.listaRelatorios(ST.estado.anoMes, ST.estado.tipo).then(function (lista) {
      ST.set({ relatorios: lista });
      if (!refs.selRelatorio) return false;
      var atual = ST.estado.relatorio;
      var existe = lista.some(function (r) { return String(r.id) === String(atual); });
      var trocou = false;
      if (!existe && lista.length) {
        atual = lista[0].id;
        ST.set({ relatorio: atual });
        trocou = true;
      }
      var novo = UI.seletor(
        lista.map(function (r) { return { value: String(r.id), label: r.id + ' · ' + r.nome }; }),
        String(atual),
        function (v) { ST.set({ relatorio: v }); ST.salvarPrefs(); recarregar(); },
        { style: 'min-width:280px;max-width:420px' });
      refs.selRelatorio.parentNode.replaceChild(novo, refs.selRelatorio);
      refs.selRelatorio = novo;
      if (lista[0] && lista[0].origem === 'fallback') {
        refs.selRelatorio.title = 'Lista do catálogo interno — a API não devolveu ListaDeRelatorio.';
      }
      return trocou;
    }).catch(function () { return false; });
  }

  /* --------------------------------- abas ---------------------------------- */

  function montarAbas() {
    var abas = U.$('#abas');
    U.clear(abas);
    VW.todas(moduloAtual()).forEach(function (v) {
      abas.appendChild(U.el('button', {
        class: 'tab', role: 'tab', id: 'tab-' + v.id, title: v.descricao,
        'aria-selected': 'false', 'aria-controls': 'view-' + v.id,
        text: v.titulo,
        onclick: function () { irPara(v.id); }
      }));
    });

    var main = U.$('#telas');
    U.clear(main);
    instancias = {};
    VW.todas(moduloAtual()).forEach(function (v) {
      main.appendChild(U.el('section', {
        class: 'view', id: 'view-' + v.id, role: 'tabpanel',
        'aria-labelledby': 'tab-' + v.id, hidden: true
      }));
    });
  }

  function irPara(id) {
    var doModulo = VW.todas(moduloAtual());
    var alvo = doModulo.find(function (v) { return v.id === id; }) || doModulo[0];
    if (!alvo) return;
    telaAtual = alvo.id;
    if (location.hash !== '#/' + alvo.id) history.replaceState(null, '', '#/' + alvo.id);

    doModulo.forEach(function (v) {
      var aba = U.$('#tab-' + v.id);
      var secao = U.$('#view-' + v.id);
      var ativo = v.id === alvo.id;
      if (aba) aba.setAttribute('aria-selected', ativo ? 'true' : 'false');
      if (secao) secao.hidden = !ativo;
    });

    var secao = U.$('#view-' + alvo.id);
    if (!instancias[alvo.id]) instancias[alvo.id] = alvo.montar(secao) || {};
    else if (instancias[alvo.id].atualizar && secao.dataset.sujo === '1') {
      secao.dataset.sujo = '0';
      instancias[alvo.id].atualizar();
    }
    redesenharGraficos();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  /** Marca todas as telas como desatualizadas e recarrega a que está visível. */
  function recarregar() {
    CH.hideTip();
    VW.todas(moduloAtual()).forEach(function (v) {
      var secao = U.$('#view-' + v.id);
      if (secao) secao.dataset.sujo = '1';
    });
    if (telaAtual && instancias[telaAtual] && instancias[telaAtual].atualizar) {
      var secao = U.$('#view-' + telaAtual);
      if (secao) secao.dataset.sujo = '0';
      instancias[telaAtual].atualizar();
    }
  }

  /* ------------------------------- inicialização ---------------------------- */

  function iniciar() {
    var prefs = ST.carregarPrefs();
    ST.carregarGrupos();
    if (!ST.estado.escala) ST.estado.escala = 1;
    if (ST.estado.escopoS1S2 === undefined) ST.estado.escopoS1S2 = true;
    if (!ST.estado.modulo) ST.estado.modulo = 'ifdata';
    global.PST.carregar();
    // Alguns ambientes de publicação bloqueiam qualquer chamada a domínio
    // externo. Quem hospeda a página nesse tipo de ambiente define esta
    // variável antes dos scripts: a interface trava no modo demonstração em
    // vez de oferecer um botão "API do BCB" que só falharia.
    if (global.IFDATA_FORCAR_DEMO) ST.estado.modo = 'demo';
    API.configurar({
      base: ST.estado.base || API.BASE_PADRAO,
      modo: ST.estado.modo === 'demo' ? 'demo' : 'live'
    });

    montarTopo();
    montarFiltros();
    montarAbas();

    API.on(function (ev) {
      if (ev.tipo === 'aviso') UI.toast(ev.msg, 'warn', 6000);
    });

    window.addEventListener('hashchange', function () {
      var id = (location.hash || '').replace('#/', '');
      if (id && id !== telaAtual) irPara(id);
    });

    // Monta a tela imediatamente: a descoberta da lista de relatórios corre em
    // paralelo e só força um recarregamento se trocar o relatório selecionado.
    var inicial = (location.hash || '').replace('#/', '') || 'consulta';
    irPara(inicial);
    carregarRelatorios().then(function (trocou) { if (trocou) recarregar(); });

  }

  global.APP = {
    iniciar: iniciar, irPara: irPara, recarregar: recarregar, trocarModulo: trocarModulo,
    definirModo: definirModo, redesenharGraficos: redesenharGraficos, MODULOS: MODULOS
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(window);

</script>
</body>
</html>
