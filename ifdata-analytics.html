  <script>
/* ===== ui.js ===== */
/* ui.js — componentes de interface reutilizáveis. Namespace global `UI`. */
(function (global) {
  'use strict';
  var U = global.U;

  /* ------------------------------ toasts ------------------------------- */

  var toasts = null;
  function toast(msg, tipo, ms) {
    if (!toasts) {
      toasts = U.el('div', { class: 'toasts', 'aria-live': 'polite' });
      document.body.appendChild(toasts);
    }
    var t = U.el('div', { class: 'toast' + (tipo ? ' toast--' + tipo : ''), text: msg });
    toasts.appendChild(t);
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 250);
    }, ms || 4200);
    return t;
  }

  /* ------------------------------- modal -------------------------------- */

  function modal(opts) {
    var box = U.el('div', { class: 'modal__box', role: 'dialog', 'aria-modal': 'true',
                            'aria-label': opts.titulo || 'Diálogo' });
    var scrim = U.el('div', { class: 'modal__scrim' });
    var raiz = U.el('div', { class: 'modal' }, [scrim, box]);
    if (opts.titulo) box.appendChild(U.el('h2', { class: 'modal__title', text: opts.titulo }));
    if (opts.sub) box.appendChild(U.el('p', { class: 'small muted', text: opts.sub }));
    if (opts.corpo) box.appendChild(opts.corpo);

    function fechar() {
      document.removeEventListener('keydown', onKey);
      if (raiz.parentNode) raiz.parentNode.removeChild(raiz);
    }
    function onKey(e) { if (e.key === 'Escape') fechar(); }

    var pe = U.el('div', { class: 'modal__foot' });
    (opts.acoes || [{ label: 'Fechar' }]).forEach(function (a) {
      pe.appendChild(U.el('button', {
        class: 'btn' + (a.primaria ? ' btn--primary' : '') + (a.perigo ? ' btn--danger' : ''),
        text: a.label,
        onclick: function () { if (!a.onClick || a.onClick() !== false) fechar(); }
      }));
    });
    box.appendChild(pe);
    scrim.addEventListener('click', fechar);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(raiz);
    var foco = box.querySelector('input, select, textarea, button');
    if (foco) foco.focus();
    return { fechar: fechar, box: box };
  }

  function confirmar(titulo, texto, onSim) {
    return modal({
      titulo: titulo,
      corpo: U.el('p', { text: texto }),
      acoes: [
        { label: 'Cancelar' },
        { label: 'Confirmar', primaria: true, onClick: onSim }
      ]
    });
  }

  /* --------------------------- multiselect ------------------------------ */

  /**
   * Seletor múltiplo com busca, chips e ações em massa.
   * opts: { opcoes:[{value,label,sub}], selecionados:[], onChange(vals),
   *         placeholder, max, corPorValor:boolean }
   */
  function multiselect(opts) {
    var selecionados = (opts.selecionados || []).slice();
    var opcoes = opts.opcoes || [];
    var raiz = U.el('div', { class: 'ms' });
    var controle = U.el('div', { class: 'ms__control' });
    var input = U.el('input', { class: 'ms__input', type: 'text',
      placeholder: opts.placeholder || 'Buscar…', 'aria-label': opts.placeholder || 'Buscar' });
    var painel = U.el('div', { class: 'ms__panel', hidden: true, role: 'listbox' });
    raiz.appendChild(controle); raiz.appendChild(painel);

    function emitir() { if (opts.onChange) opts.onChange(selecionados.slice()); }

    function rotulo(v) {
      var o = opcoes.find(function (x) { return String(x.value) === String(v); });
      return o ? o.label : String(v);
    }

    function pintarChips() {
      U.clear(controle);
      selecionados.forEach(function (v) {
        controle.appendChild(U.el('span', { class: 'chip', title: rotulo(v) }, [
          opts.corPorValor
            ? U.el('span', { class: 'chip__dot', style: 'background:' + global.CH.Colors.of(v) })
            : null,
          U.el('span', { class: 'chip__text', text: U.truncate(rotulo(v), 26) }),
          U.el('button', { class: 'chip__x', 'aria-label': 'Remover ' + rotulo(v), text: '×',
            onclick: function (e) {
              e.stopPropagation();
              selecionados = selecionados.filter(function (x) { return x !== v; });
              pintarChips(); pintarOpcoes(); emitir();
            } })
        ]));
      });
      controle.appendChild(input);
    }

    function filtradas() {
      var q = U.norm(input.value);
      if (!q) return opcoes;
      return opcoes.filter(function (o) {
        return U.norm(o.label).indexOf(q) >= 0 || U.norm(o.sub || '').indexOf(q) >= 0 ||
               String(o.value).toLowerCase().indexOf(q) >= 0;
      });
    }

    function pintarOpcoes() {
      U.clear(painel);
      var lista = filtradas();
      if (!lista.length) {
        painel.appendChild(U.el('div', { class: 'ms__empty', text: 'Nenhum resultado.' }));
      }
      lista.slice(0, 400).forEach(function (o) {
        var sel = selecionados.indexOf(o.value) >= 0;
        painel.appendChild(U.el('div', {
          class: 'ms__opt', role: 'option', 'aria-selected': sel ? 'true' : 'false',
          onclick: function () {
            if (sel) selecionados = selecionados.filter(function (x) { return x !== o.value; });
            else {
              if (opts.max && selecionados.length >= opts.max) {
                toast('Limite de ' + opts.max + ' seleções — remova alguma antes de incluir outra.', 'warn');
                return;
              }
              selecionados.push(o.value);
            }
            input.value = '';
            pintarChips(); pintarOpcoes(); emitir();
          }
        }, [
          U.el('span', { text: sel ? '✓' : '', style: 'width:12px;flex:0 0 auto;color:var(--accent)' }),
          U.el('span', {}, [
            U.el('span', { text: o.label }),
            o.sub ? U.el('small', { text: '  ' + o.sub }) : null
          ])
        ]));
      });
      if (lista.length > 400) {
        painel.appendChild(U.el('div', { class: 'ms__empty',
          text: lista.length + ' resultados — refine a busca para ver todos.' }));
      }
      var massa = U.el('div', { class: 'ms__bulk' }, [
        U.el('button', { class: 'btn btn--sm', text: 'Selecionar visíveis', onclick: function () {
          var alvo = filtradas().map(function (o) { return o.value; });
          var lim = opts.max || 999;
          alvo.forEach(function (v) {
            if (selecionados.indexOf(v) < 0 && selecionados.length < lim) selecionados.push(v);
          });
          pintarChips(); pintarOpcoes(); emitir();
        } }),
        U.el('button', { class: 'btn btn--sm', text: 'Limpar', onclick: function () {
          selecionados = []; pintarChips(); pintarOpcoes(); emitir();
        } })
      ]);
      painel.appendChild(massa);
    }

    controle.addEventListener('click', function () { input.focus(); painel.hidden = false; pintarOpcoes(); });
    input.addEventListener('focus', function () { painel.hidden = false; pintarOpcoes(); });
    input.addEventListener('input', pintarOpcoes);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { painel.hidden = true; }
      if (e.key === 'Backspace' && !input.value && selecionados.length) {
        selecionados.pop(); pintarChips(); pintarOpcoes(); emitir();
      }
      if (e.key === 'Enter') {
        var primeira = filtradas()[0];
        if (primeira && selecionados.indexOf(primeira.value) < 0) {
          if (!opts.max || selecionados.length < opts.max) {
            selecionados.push(primeira.value);
            input.value = ''; pintarChips(); pintarOpcoes(); emitir();
          }
        }
        e.preventDefault();
      }
    });
    document.addEventListener('click', function (e) {
      if (!raiz.contains(e.target)) painel.hidden = true;
    });

    pintarChips();

    return {
      node: raiz,
      valores: function () { return selecionados.slice(); },
      definir: function (vals) { selecionados = (vals || []).slice(); pintarChips(); pintarOpcoes(); },
      atualizarOpcoes: function (novas, manterSelecao) {
        opcoes = novas || [];
        if (!manterSelecao) selecionados = [];
        else {
          var validos = {};
          opcoes.forEach(function (o) { validos[o.value] = true; });
          selecionados = selecionados.filter(function (v) { return validos[v]; });
        }
        pintarChips(); pintarOpcoes();
      }
    };
  }

  /* ------------------------------ campos -------------------------------- */

  function campo(label, controle, hint) {
    return U.el('div', { class: 'filterbar__group' + (hint === 'grow' ? ' filterbar__group--grow' : '') }, [
      U.el('label', { class: 'field-label', text: label }),
      controle

  }

  function seletor(opcoes, valor, onChange, attrs) {
    var s = U.el('select', Object.assign({ onchange: function () { onChange(s.value); } }, attrs || {}));
    (opcoes || []).forEach(function (o) {
      s.appendChild(U.el('option', { value: o.value, text: o.label,
        selected: String(o.value) === String(valor) }));
    });

  }

  function segmentado(opcoes, valor, onChange) {

        type: 'button', text: o.label, 'aria-pressed': String(o.value) === String(valor) ? 'true' : 'false',

  }

  /* ------------------------------- cards -------------------------------- */

  /**
   * Card com cabeçalho, ferramentas e corpo. Todo card de gráfico ganha por

   * e os botões de exportação.
   */
  function card(opts) {
    var corpo = U.el('div', { class: 'card__body' + (opts.flush ? ' card__body--flush' : '') });
    var tools = U.el('div', { class: 'card__tools' });

      U.el('div', {}, [
        U.el('h3', { class: 'card__title', text: opts.titulo }),
        opts.sub ? U.el('div', { class: 'card__sub', text: opts.sub }) : null
      ]),
      tools
    ]);
    var raiz = U.el('div', { class: 'card' }, [cabecalho, corpo]);
    return { node: raiz, corpo: corpo, tools: tools, cabecalho: cabecalho };
  }

  /** Par gráfico + tabela com alternância — garante leitura sem depender de cor. */
  function grafico(opts) {
    var c = card(opts);
    var areaGrafico = U.el('div');
    var areaTabela = U.el('div', { hidden: true });
    c.corpo.appendChild(areaGrafico);
    c.corpo.appendChild(areaTabela);

    var modo = 'grafico';
    c.tools.appendChild(segmentado(
      [{ label: 'Gráfico', value: 'grafico' }, { label: 'Tabela', value: 'tabela' }],
      'grafico',
      function (v) {
        modo = v;
        areaGrafico.hidden = v !== 'grafico';
        areaTabela.hidden = v !== 'tabela';

    if (opts.exportar !== false) {
      c.tools.appendChild(U.el('button', {
        class: 'btn btn--sm btn--ghost', text: 'PNG', title: 'Baixar imagem do gráfico',
        onclick: function () {
          var svg = areaGrafico.querySelector('svg');

          U.downloadPNG((U.slug(opts.titulo) || 'grafico') + '.png', svg, 2);
        }
      }));
      c.tools.appendChild(U.el('button', {
        class: 'btn btn--sm btn--ghost', text: 'SVG', title: 'Baixar vetor do gráfico',
        onclick: function () {
          var svg = areaGrafico.querySelector('svg');
          if (!svg) return toast('Nada para exportar.', 'warn');
          U.downloadSVG((U.slug(opts.titulo) || 'grafico') + '.svg', svg);
        }
      }));
    }

    return { node: c.node, grafico: areaGrafico, tabela: areaTabela, tools: c.tools,
             modo: function () { return modo; } };
  }

  function nota(texto, tipo, icone) {
    return U.el('div', { class: 'note' + (tipo ? ' note--' + tipo : '') }, [
      U.el('span', { class: 'note__icon', text: icone || (tipo === 'bad' ? '!' : tipo === 'warn' ? '!' : 'i') }),
      U.el('div', typeof texto === 'string' ? { text: texto } : {}, typeof texto === 'string' ? null : texto)
    ]);
  }

  function vazio(titulo, texto) {
    return U.el('div', { class: 'empty' }, [
      U.el('h3', { text: titulo }),
      U.el('div', { class: 'small', text: texto || '' })

  }

  function carregando(texto) {
    return U.el('div', { class: 'loading' }, [
      U.el('div', { class: 'spinner' }),
      U.el('span', { text: texto || 'Carregando dados do Banco Central…' })

  }

  /** Stat tile: rótulo, valor, variação opcional e sparkline opcional. */
  function stat(opts) {
    var box = U.el('div', { class: 'stat' });
    box.appendChild(U.el('div', { class: 'stat__label', text: opts.label }));
    box.appendChild(U.el('div', { class: 'stat__value', text: opts.valor }));
    if (opts.delta !== undefined && opts.delta !== null && U.isNum(opts.delta)) {
      var dir = opts.delta > 0.05 ? 'up' : opts.delta < -0.05 ? 'down' : 'flat';
      var bom = opts.melhor === 'baixo' ? (dir === 'down') : (dir === 'up');
      var classe = dir === 'flat' ? 'flat' : (bom ? 'up' : 'down');
      box.appendChild(U.el('div', { class: 'stat__delta stat__delta--' + classe }, [
        U.el('span', { text: dir === 'up' ? '▲' : dir === 'down' ? '▼' : '■' }),
        U.el('span', { text: U.signed(opts.delta, opts.deltaDecimais == null ? 1 : opts.deltaDecimais) +
          (opts.deltaUnidade || ' p.p.') + (opts.deltaRef ? ' vs ' + opts.deltaRef : '') })
      ]));
    }
    if (opts.nota) box.appendChild(U.el('div', { class: 'stat__note', text: opts.nota }));
    if (opts.serie && opts.serie.length > 1) {
      var sp = U.el('div', { class: 'stat__spark' });
      box.appendChild(sp);
      setTimeout(function () { global.CH.sparkline(sp, opts.serie, 'var(--accent)'); }, 0);
    }
    return box;
  }

  global.UI = {
    toast: toast, modal: modal, confirmar: confirmar, multiselect: multiselect,
    campo: campo, seletor: seletor, segmentado: segmentado, alternador: alternador,
    card: card, grafico: grafico, nota: nota, vazio: vazio, carregando: carregando, stat: stat
  };
})(window);

/* ===== table.js ===== */
/* table.js — tabela de dados com ordenação, busca, coluna fixa e exportação.
   Namespace global `TBL`. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI;

  /**
   * @param {HTMLElement} node contêiner
   * @param {Object} cfg
   *   columns: [{key, label, tipo:'num'|'txt', decimais, fmt(v,row), largura, sticky}]
   *   rows:    [{...}]
   *   ordenar: {key, dir}      ordenação inicial
   *   busca:   boolean         mostra campo de busca
   *   maxLinhas: number        corta a exibição (com botão "mostrar todas")
   *   nomeArquivo: string      base do CSV exportado
   *   rodape: string           texto extra no rodapé
   */
  function render(node, cfg) {
    var colunas = cfg.columns || [];
    var linhas = cfg.rows || [];
    var ordem = cfg.ordenar ? { key: cfg.ordenar.key, dir: cfg.ordenar.dir || 'desc' } : null;
    var termo = '';
    var limite = cfg.maxLinhas || 150;
    var expandido = false;

/* store.js — estado da aplicação e persistência dos conjuntos de bancos.
   Namespace global `ST`. */
(function (global) {
  'use strict';
  var U = global.U;

  var CHAVE_GRUPOS = 'ifdata.grupos.v1';
  var CHAVE_PREFS = 'ifdata.prefs.v1';

  var estado = {
    anoMes: U.latestLikelyPeriod(),
    tipo: 1,
    relatorio: '1',
    anualizar: true,
    escopoS1S2: true,             // Risk Bench trabalha com S1 e S2
    modulo: 'ifdata',             // ifdata | publicacoes
    escala: 1,
    modo: 'auto',                 // auto | live | demo
    base: null,                   // URL alternativa da API
    overridesCampos: {},          // campoCanonico -> nome de coluna
    dataset: null,                // último resultado normalizado
    relatorios: [],
    grupoAtivo: null,
    grupos: []
  };

  var ouvintes = [];
  function on(fn) { ouvintes.push(fn); return function () { ouvintes = ouvintes.filter(function (f) { return f !== fn; }); }; }
  function emit(evento) { ouvintes.forEach(function (fn) { try { fn(evento, estado); } catch (e) { console.error(e); } }); }

  function set(patch, evento) {
    Object.assign(estado, patch);
    emit(evento || 'estado');
  }

  /* ------------------------------ prefs -------------------------------- */

  function salvarPrefs() {
    try {
      localStorage.setItem(CHAVE_PREFS, JSON.stringify({
        anoMes: estado.anoMes, tipo: estado.tipo, relatorio: estado.relatorio,
        anualizar: estado.anualizar, modo: estado.modo, base: estado.base,
        escopoS1S2: estado.escopoS1S2, modulo: estado.modulo, escala: estado.escala
      }));
    } catch (e) {}
  }
  function carregarPrefs() {
    try {
      var p = JSON.parse(localStorage.getItem(CHAVE_PREFS) || 'null');
      if (!p) return null;
      if (p.anoMes) estado.anoMes = p.anoMes;
      if (p.tipo) estado.tipo = Number(p.tipo);
      if (p.relatorio) estado.relatorio = String(p.relatorio);
      if (typeof p.anualizar === 'boolean') estado.anualizar = p.anualizar;
      if (p.modo) estado.modo = p.modo;
      if (p.base) estado.base = p.base;
      if (typeof p.escopoS1S2 === 'boolean') estado.escopoS1S2 = p.escopoS1S2;
      if (p.modulo) estado.modulo = p.modulo;
      if (p.escala) estado.escala = Number(p.escala);
      return p;
    } catch (e) { return null; }
  }

  /* ------------------------------ grupos -------------------------------- */

  function carregarGrupos() {
    try {
      var g = JSON.parse(localStorage.getItem(CHAVE_GRUPOS) || '[]');
      estado.grupos = Array.isArray(g) ? g : [];
    } catch (e) { estado.grupos = []; }
    return estado.grupos;
  }

  function salvarGrupos() {
    try { localStorage.setItem(CHAVE_GRUPOS, JSON.stringify(estado.grupos)); }
    catch (e) { global.UI && global.UI.toast('Não foi possível salvar os grupos neste navegador.', 'bad'); }
    emit('grupos');
  }

  function criarGrupo(nome, membros, descricao) {
    var g = {
      id: U.uid('grp'),
      nome: nome || 'Novo conjunto',
      descricao: descricao || '',
      membros: (membros || []).map(function (m) {
        return typeof m === 'string' ? { id: m, nome: m } : { id: String(m.id), nome: m.nome || String(m.id) };
      }),
      criadoEm: new Date().toISOString()
    };
    estado.grupos.push(g);
    salvarGrupos();
    return g;
  }

  function atualizarGrupo(id, patch) {
    var g = estado.grupos.find(function (x) { return x.id === id; });
    if (!g) return null;
    Object.assign(g, patch);
    g.atualizadoEm = new Date().toISOString();
    salvarGrupos();
    return g;
  }

  function removerGrupo(id) {
    estado.grupos = estado.grupos.filter(function (g) { return g.id !== id; });
    if (estado.grupoAtivo === id) estado.grupoAtivo = null;
    salvarGrupos();
  }

  function grupo(id) { return estado.grupos.find(function (g) { return g.id === id; }) || null; }

  function duplicarGrupo(id) {
    var g = grupo(id);
    if (!g) return null;
    return criarGrupo(g.nome + ' (cópia)', g.membros.slice(), g.descricao);
  }

  function exportarGrupos() {
    return JSON.stringify({ versao: 1, exportadoEm: new Date().toISOString(),
                            grupos: estado.grupos }, null, 2);
  }

  function importarGrupos(texto, substituir) {
    var obj = JSON.parse(texto);
    var lista = Array.isArray(obj) ? obj : (obj && obj.grupos) || [];
    if (!Array.isArray(lista)) throw new Error('Formato não reconhecido.');
    var limpos = lista.map(function (g) {
      return {
        id: U.uid('grp'),
        nome: String(g.nome || 'Conjunto importado'),
        descricao: String(g.descricao || ''),
        membros: (g.membros || []).map(function (m) {
          return typeof m === 'string' ? { id: m, nome: m } : { id: String(m.id), nome: String(m.nome || m.id) };
        }),
        criadoEm: new Date().toISOString()
      };
    }).filter(function (g) { return g.membros.length; });
    estado.grupos = substituir ? limpos : estado.grupos.concat(limpos);
    salvarGrupos();
    return limpos.length;
  }

  /** Conjuntos sugeridos, montados a partir do dataset em tela (por tamanho). */
  function sugerirGrupos(rows, campoAtivo) {
    if (!rows || !rows.length || !campoAtivo) return [];
    var ordenado = rows.slice().sort(function (a, b) {
      return (U.toNumber(b[campoAtivo]) || 0) - (U.toNumber(a[campoAtivo]) || 0);
    });
    function fatia(ini, fim) {
      return ordenado.slice(ini, fim).map(function (r) { return { id: r.__id, nome: r.__nome }; });
    }
    return [
      { nome: 'Top 5 por ativo', membros: fatia(0, 5),
        descricao: 'Cinco maiores instituições do recorte atual.' },
      { nome: 'Top 10 por ativo', membros: fatia(0, 10),
        descricao: 'Dez maiores instituições do recorte atual.' },
      { nome: '6º ao 20º por ativo', membros: fatia(5, 20),
        descricao: 'Faixa de médio porte — peers típicos fora do bloco dos cinco maiores.' },
      { nome: 'Cauda (fora do top 20)', membros: fatia(20, 60),
        descricao: 'Instituições menores do recorte atual.' }
    ].filter(function (g) { return g.membros.length >= 2; });
  }

  global.ST = {
    estado: estado, on: on, set: set, emit: emit,
    salvarPrefs: salvarPrefs, carregarPrefs: carregarPrefs,
    carregarGrupos: carregarGrupos, salvarGrupos: salvarGrupos,
    criarGrupo: criarGrupo, atualizarGrupo: atualizarGrupo, removerGrupo: removerGrupo,
    grupo: grupo, duplicarGrupo: duplicarGrupo,
    exportarGrupos: exportarGrupos, importarGrupos: importarGrupos,
    sugerirGrupos: sugerirGrupos
  };
})(window);

      var numericas = columns.filter(function (c) {
        return rows.some(function (r) { return U.isNum(r[c]); });
      });
      if (numericas.length) columns = numericas;
    }

    var metaColumns = Object.keys(rows[0] || {}).filter(function (k) {
      return columns.indexOf(k) < 0;
    });

    rows.forEach(function (r, i) {
      r.__id = String(r[kInst] != null ? r[kInst] : (kNome && r[kNome]) || ('lin' + i));
      r.__nome = String((kNome && r[kNome]) || r[kInst] || ('Instituição ' + (i + 1)));
      r.__anoMes = ctx.anoMes;
      r.__tipo = ctx.tipo;
    });

    return {
      rows: rows, columns: columns, metaColumns: metaColumns,
      forma: longa ? 'longa→larga' : 'larga',
      chaveInst: kInst, chaveNome: kNome,
      bruto: amostra
    };
  }

  /* ---------------------------- endpoints ------------------------------ */

  function urlValores(anoMes, tipo, relatorio) {
    return state.base +
      "/IfDataValores(AnoMes=@AnoMes,TipoInstituicao=@TipoInstituicao,Relatorio=@Relatorio)" +
      "?@AnoMes=" + encodeURIComponent(anoMes) +
      "&@TipoInstituicao=" + encodeURIComponent(tipo) +
      "&@Relatorio=" + encodeURIComponent("'" + relatorio + "'");
  }
  function urlCadastro(anoMes, tipo, tipoComAspas) {
    var valorTipo = tipoComAspas ? "'" + tipo + "'" : String(tipo);
    return state.base +
      "/IfDataCadastro(AnoMes=@AnoMes,TipoInstituicao=@TipoInstituicao)" +
      "?@AnoMes=" + encodeURIComponent(anoMes) +
      "&@TipoInstituicao=" + encodeURIComponent(valorTipo);
  }

  /** Lista de relatórios: tenta as formas conhecidas do endpoint. */
  function listaRelatorios(anoMes, tipo) {
    var chave = 'rel.' + anoMes + '.' + tipo;
    if (memCache.has(chave)) return Promise.resolve(memCache.get(chave));
    var doLs = lsGet(chave);
    if (doLs) { memCache.set(chave, doLs); return Promise.resolve(doLs); }

    if (state.demoAtivo) {
      var d = global.DEMO.relatorios();
      memCache.set(chave, d);
      return Promise.resolve(d);
    }

    var tentativas = [
      state.base + '/ListaDeRelatorio(AnoMes=@AnoMes,TipoInstituicao=@TipoInstituicao)' +
        '?@AnoMes=' + anoMes + '&@TipoInstituicao=' + tipo,
      state.base + '/ListaDeRelatorio',
      state.base + '/ListaDeRelatorios'
    ];

    function tentar(i) {
      if (i >= tentativas.length) {
        var fb = global.CAT.RELATORIOS_FALLBACK.map(function (r) {
          return { id: r.id, nome: r.nome, origem: 'fallback' };
        });
        emit({ tipo: 'aviso', msg: 'Lista de relatórios não pôde ser descoberta na API; usando catálogo interno.' });
        return Promise.resolve(fb);
      }
      var alvo = tentativas[i];
      var sep = alvo.indexOf('?') >= 0 ? '&' : '?';
      return getJSON(comFormato(alvo + sep + '$top=500'))
        .catch(function () { return getJSON(comFormato(alvo)); })
        .then(function (json) {
          var v = (json && json.value) || [];
          if (!v.length) throw new Error('vazio');
          var kId = acharChave(v[0], ['Relatorio', 'CodigoRelatorio', 'Codigo', 'Id', 'NumeroRelatorio']);
          var kNome = acharChave(v[0], ['NomeRelatorio', 'Nome', 'Descricao', 'Titulo']);
          var out = v.map(function (r) {
            return {
              id: String(r[kId] != null ? r[kId] : r[kNome]),
              nome: String(r[kNome] != null ? r[kNome] : r[kId]),
              origem: 'api'
            };
          }).filter(function (r) { return r.id && r.id !== 'undefined'; });
          if (!out.length) throw new Error('sem id');
          return out;
        })
        .catch(function () { return tentar(i + 1); });
    }

    return tentar(0).then(function (out) {
      memCache.set(chave, out);
      if (out[0] && out[0].origem === 'api') lsSet(chave, out);
      return out;
    });
  }

  /**
   * O IfDataCadastro recusou (HTTP 400) a assinatura documentada, e sem acesso
   * à API não dá para saber qual variante ele aceita. Em vez de apostar numa,
   * enumeramos as plausíveis e usamos a primeira que responder com dados — a
   * escolha fica guardada na sessão para não repetir a busca a cada período.
   */
  function candidatosCadastro(anoMes, tipo) {
    var raiz = state.base + '/IfDataCadastro';
    var aspas = function (v) { return "'" + v + "'"; };
    var lista = [];

    // A documentação do BCB exemplifica o cadastro SÓ com AnoMes — essa vem primeiro.
    lista.push({ rotulo: 'somente AnoMes',
      url: raiz + '(AnoMes=@AnoMes)?@AnoMes=' + encodeURIComponent(anoMes) });
    lista.push({ rotulo: "somente AnoMes entre aspas",
      url: raiz + '(AnoMes=@AnoMes)?@AnoMes=' + encodeURIComponent(aspas(anoMes)) });

    var assinatura = '(AnoMes=@AnoMes,TipoInstituicao=@TipoInstituicao)';
    [[String(anoMes), String(tipo)],
     [String(anoMes), aspas(tipo)],
     [aspas(anoMes), String(tipo)],
     [aspas(anoMes), aspas(tipo)]].forEach(function (par) {
      lista.push({
        rotulo: 'AnoMes=' + par[0] + ', TipoInstituicao=' + par[1],
        url: raiz + assinatura + '?@AnoMes=' + encodeURIComponent(par[0]) +
             '&@TipoInstituicao=' + encodeURIComponent(par[1])
      });
    });

    lista.push({ rotulo: 'sem parâmetros', url: raiz });
    return lista;
  }

  /* Cada assinatura é tentada em três modos de leitura, do mais simples ao mais
     exigente: serviços do Olinda às vezes aceitam a consulta mas recusam $skip,
     e pedir paginação de saída transformava uma assinatura boa em erro 400. */
  function lerCadastro(url) {
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    var simples = url + sep + '$format=json';
    var comTop = url + sep + '$top=10000&$format=json';
    function valores(json) { return (json && json.value) || []; }
    return getJSON(simples, 0, 25000).then(valores)
      .catch(function () { return getJSON(comTop, 0, 25000).then(valores); })
      .catch(function () { return getTodos(url); });
  }

  /** Testa cada assinatura com $top=1 e devolve o que cada uma respondeu. */
  function sondarCadastro(anoMes, tipo) {
    var candidatos = candidatosCadastro(anoMes, tipo);
    var resultados = [];
    function passo(i) {
      if (i >= candidatos.length) return Promise.resolve(resultados);
      var c = candidatos[i];
      var url = c.url + (c.url.indexOf('?') >= 0 ? '&' : '?') + '$format=json';
      return getJSON(url, 0, 20000).then(function (json) {
        var v = (json && json.value) || [];
        resultados.push({ rotulo: c.rotulo, url: url, ok: true, registros: v.length,
                          chaves: v[0] ? Object.keys(v[0]) : [], exemplo: v[0] || null });
      }).catch(function (e) {
        resultados.push({ rotulo: c.rotulo, url: url, ok: false,
                          erro: (e && e.message) || String(e) });
      }).then(function () { return passo(i + 1); });
    }
    return passo(0);
  }

  /** Cadastro (instituições) de um período.
      O parâmetro TipoInstituicao aparece ora numérico, ora entre aspas, conforme
      o serviço — em vez de apostar numa forma, tentamos as duas. */
  function cadastro(anoMes, tipo) {
    var chave = 'cad.' + anoMes + '.' + tipo;
    if (memCache.has(chave)) return Promise.resolve(memCache.get(chave));
    if (pendentes.has(chave)) return pendentes.get(chave);
    if (state.demoAtivo) {
      var d = global.DEMO.cadastro(anoMes, tipo);
      memCache.set(chave, d);
      return Promise.resolve(d);
    }

    /* Desistir é parte do contrato. Quando nenhuma assinatura respondeu, repetir
       a sondagem a cada período transforma uma série de doze trimestres em
       centenas de requisições — e um serviço que já estava recusando passa a
       devolver 500 por excesso. Uma vez que não deu, não insiste até que o
       usuário peça "Atualizar" (que limpa o cache e estas marcas). */
    if (state.cadastroIndisponivel) {
      return Promise.reject(new Error('IfDataCadastro indisponível nesta sessão' +
        (state.erroCadastro ? ': ' + state.erroCadastro : '')));
    }

    var todos = candidatosCadastro(anoMes, tipo);
    // assinatura já descoberta: vai direto nela, sem sondar de novo
    var candidatos = U.isNum(state.assinaturaCadastro)
      ? [todos[state.assinaturaCadastro]]
      : todos;

    function tentar(i, ultimoErro) {
      if (i >= candidatos.length) {
        if (!U.isNum(state.assinaturaCadastro)) {
          state.cadastroIndisponivel = true;
          state.erroCadastro = (ultimoErro && ultimoErro.message) || 'nenhuma assinatura respondeu';
        }
        throw (ultimoErro || new Error('nenhuma assinatura do IfDataCadastro respondeu'));
      }
      var c = candidatos[i];
      /* Um pedido só por assinatura, sem paginação e sem retentativa: a
         paginação é justamente o que vários recursos do Olinda recusam, e
         repetir um 500 durante a sondagem só multiplica a carga. */
      var url = c.url + (c.url.indexOf('?') >= 0 ? '&' : '?') + '$format=json';
      return getJSON(url, 0, 25000, true)
        .then(function (json) {
          var v = (json && json.value) || [];
          if (!v.length) throw new Error('resposta vazia');
          memCache.set(chave, v);
          state.urlCadastroUsada = c.url;
          state.assinaturaCadastro = todos.findIndex(function (x) { return x.rotulo === c.rotulo; });
          state.cadastroIndisponivel = false;
          state.erroCadastro = null;
          return v;
        })
        .catch(function (e) { return tentar(i + 1, e); });
    }

    var promessa = Promise.resolve().then(function () { return tentar(0, null); });
    pendentes.set(chave, promessa);
    promessa.catch(function () {}).then(function () { pendentes.delete(chave); });
    return promessa;
  }

  /**
   * Valores de um relatório, já normalizados para o formato largo.
   * @returns Promise<{rows, columns, metaColumns, forma, ...}>
   */
  function valores(anoMes, tipo, relatorio) {
    var chave = 'val.' + anoMes + '.' + tipo + '.' + relatorio;
    if (memCache.has(chave)) return Promise.resolve(memCache.get(chave));

    var ctx = { anoMes: String(anoMes), tipo: tipo, relatorio: relatorio };

    if (state.demoAtivo) {
      var dados = normalizar(global.DEMO.valores(anoMes, tipo, relatorio), ctx);
      dados.demo = true;
      return enriquecerComCadastro(dados, anoMes, tipo).then(function (d) {
        memCache.set(chave, d);
        return d;
      });
    }

    emit({ tipo: 'buscando', chave: chave });
    return getTodos(urlValores(anoMes, tipo, relatorio))
      .then(function (brutas) {
        var dados = normalizar(brutas, ctx);
        dados.url = urlValores(anoMes, tipo, relatorio);
        dados.nBrutas = brutas.length;
        return enriquecerComCadastro(dados, anoMes, tipo);
      })
      .then(function (dados) {
        state.ultimoDiagnostico = {
          url: dados.url, forma: dados.forma, linhas: dados.rows.length,
          colunas: dados.columns.length, amostra: dados.bruto,
          cadastro: dados.cadastro || null, quando: new Date().toISOString()
        };
        memCache.set(chave, dados);
        emit({ tipo: 'ok', chave: chave, dados: dados });
        return dados;
      })
      .catch(function (e) {
        emit({ tipo: 'erro', chave: chave, erro: e });
        throw e;
      });
  }

  /* Campos de identificação que o cadastro pode completar quando o relatório de
     valores só traz o código da instituição. */
  var CAMPOS_CADASTRO = ['NomeInstituicao', 'Instituicao', 'Nome', 'NomeConglomerado',
                         'RazaoSocial', 'Cnpj', 'UF', 'Cidade', 'Municipio',
                         'SR', 'Segmento', 'TCB', 'TC', 'TD'];

  /**
   * O IfDataValores identifica a instituição só pelo código; os nomes (e a UF, a
   * cidade e o segmento) moram no IfDataCadastro. Esta função cruza os dois pelo
   * código e completa o que falta — silenciosamente, se o cadastro não responder.
   */
  function enriquecerComCadastro(dados, anoMes, tipo) {
    if (!dados.rows.length) return Promise.resolve(dados);
    var url = urlCadastro(anoMes, tipo);

    /* O cruzamento roda SEMPRE que há linhas: o cadastro é a fonte oficial do
       nome da instituição, então ele vence o que porventura tenha vindo no
       relatório de valores. E o resultado é sempre registrado em dados.cadastro
       — inclusive quando falha — para que o Diagnóstico diga a verdade em vez
       de sugerir que estava tudo bem. */
    // Promise.resolve() garante que até uma exceção síncrona caia no .catch
    // abaixo, em vez de derrubar a consulta inteira de valores.
    return Promise.resolve().then(function () {
      return cadastro(anoMes, tipo);
    }).then(function (lista) {
      if (!lista || !lista.length) {
        dados.cadastro = { status: 'vazio', url: url,
          detalhe: 'O IfDataCadastro respondeu sem nenhuma instituição para este período e tipo.' };
        return dados;
      }
      var amostra = lista[0];
      var kId = acharChave(amostra, ['CodInst', 'Codigo', 'Cnpj', 'CNPJ']);
      var kNome = acharChave(amostra, ['NomeInstituicao', 'Instituicao', 'Nome',
                                       'NomeConglomerado', 'RazaoSocial']);
      if (!kId || !kNome) {
        dados.cadastro = { status: 'sem-chave', url: url, chaves: Object.keys(amostra),
          detalhe: 'O cadastro respondeu, mas não foi possível identificar nele ' +
                   (!kId ? 'a coluna de código' : 'a coluna de nome') + '.' };
        return dados;
      }

      var porId = new Map();
      lista.forEach(function (c) {
        var id = String(c[kId] == null ? '' : c[kId]).trim();
        if (id) porId.set(id, c);
      });

      /* Rede de segurança: se cada endpoint identificar a instituição por uma
         chave diferente (código de um lado, CNPJ do outro), o casamento pela
         chave principal dá zero — então tentamos também pelo CNPJ, comparando
         apenas os dígitos. */
      var kCnpjCad = acharChave(amostra, ['Cnpj', 'CNPJ']);
      var kCnpjVal = acharChave(dados.rows[0], ['Cnpj', 'CNPJ']);
      var porCnpj = new Map();
      if (kCnpjCad && kCnpjVal) {
        lista.forEach(function (c) {
          var d = String(c[kCnpjCad] == null ? '' : c[kCnpjCad]).replace(/\D/g, '');
          if (d) porCnpj.set(d, c);
        });
      }
      function achar(r) {
        var c = porId.get(String(r.__id).trim());
        if (c) return c;
        if (kCnpjVal && porCnpj.size) {
          var d = String(r[kCnpjVal] == null ? '' : r[kCnpjVal]).replace(/\D/g, '');
          if (d) return porCnpj.get(d) || null;
        }
        return null;
      }

      var casados = 0, nomeados = 0;
      dados.rows.forEach(function (r) {
        var c = achar(r);
        if (!c) return;
        casados++;
        var nome = String(c[kNome] == null ? '' : c[kNome]).trim();
        if (nome && nome !== r.__nome) { r.__nome = nome; nomeados++; }
        CAMPOS_CADASTRO.forEach(function (campo) {
          var chave = acharChave(c, [campo]);
          if (!chave) return;
          var atual = r[campo];
          if (atual === undefined || atual === null || atual === '') r[campo] = c[chave];
        });
      });

      dados.cadastro = {
        status: casados ? 'ok' : 'sem-casamento',
        url: state.urlCadastroUsada || url, total: lista.length, casados: casados, nomeados: nomeados,
        chaveId: kId, chaveNome: kNome,
        chavesCadastro: Object.keys(amostra),
        exemploCadastro: amostra,
        detalhe: casados
          ? null
          : 'Nenhum código do relatório de valores foi encontrado no cadastro — ' +
            'os dois endpoints parecem identificar a instituição de formas diferentes.'
      };
      dados.metaColumns = Object.keys(dados.rows[0] || {}).filter(function (k) {
        return dados.columns.indexOf(k) < 0 && k.slice(0, 2) !== '__';
      });
      return dados;
    }).catch(function (e) {
      dados.cadastro = { status: 'falhou', url: url, erro: (e && e.message) || String(e),
        detalhe: 'A consulta ao IfDataCadastro não completou, então os nomes não puderam ser buscados.' };
      return dados;
    });
  }

  /** Carrega o mesmo relatório em vários períodos (para séries temporais). */
  function serie(periodos, tipo, relatorio, onProgress) {
    var out = [], i = 0;
    function passo() {
      if (i >= periodos.length) return Promise.resolve(out);
      var p = periodos[i++];
      if (onProgress) onProgress(i, periodos.length, p);
      return valores(p, tipo, relatorio)
        .then(function (d) { out.push({ anoMes: p, dados: d }); })
        .catch(function (e) { out.push({ anoMes: p, erro: e, dados: { rows: [], columns: [] } }); })
        .then(passo);
    }
    return passo();
  }

  /** Testa a conectividade com a API e devolve um diagnóstico legível. */
  function testar(anoMes, tipo, relatorio) {
    var url = comFormato(urlValores(anoMes, tipo, relatorio) + '&$top=1');
    var t0 = performance.now();
    return getJSON(url).then(function (json) {
      var v = (json && json.value) || [];
      return {
        ok: true, ms: Math.round(performance.now() - t0), url: url,
        registros: v.length, amostra: v[0] || null,
        chaves: v[0] ? Object.keys(v[0]) : []
      };
    }).catch(function (e) {
      return { ok: false, ms: Math.round(performance.now() - t0), url: url,
               erro: e.message || String(e) };
    });
  }

  /** Descobre quais trimestres respondem com dados, do mais recente para trás. */
  function periodosDisponiveis(tipo, relatorio, maxTrimestres, onProgress) {
    var lista = U.allPeriods(2000).slice(0, maxTrimestres || 40);
    var ok = [], i = 0, falhasSeguidas = 0;
    function passo() {
      if (i >= lista.length || falhasSeguidas >= 4) return Promise.resolve(ok);
      var p = lista[i++];
      if (onProgress) onProgress(i, lista.length, p);
      return getJSON(comFormato(urlValores(p, tipo, relatorio) + '&$top=1'))
        .then(function (json) {
          var tem = json && json.value && json.value.length;
          if (tem) { ok.push(p); falhasSeguidas = 0; } else { falhasSeguidas++; }
        })
        .catch(function () { falhasSeguidas++; })
        .then(passo);
    }
    return passo();
  }

  function configurar(opts) {
    if (opts.base) state.base = String(opts.base).replace(/\/+$/, '');
    if (opts.modo) {
      state.modo = opts.modo;
      state.demoAtivo = opts.modo === 'demo';
    }
    if (opts.timeoutMs) state.timeoutMs = opts.timeoutMs;
    state.cadastroIndisponivel = false;
    state.erroCadastro = null;
    state.assinaturaCadastro = null;
    memCache.clear();
    pendentes.clear();
    emit({ tipo: 'config', state: state });
  }

  global.API = {
    state: state,
    BASE_PADRAO: BASE_PADRAO,
    configurar: configurar,
    listaRelatorios: listaRelatorios,
    cadastro: cadastro,
    valores: valores,
    serie: serie,
    testar: testar,
    periodosDisponiveis: periodosDisponiveis,
    limparCache: limparCache,
    normalizar: normalizar, pareceCodigo: pareceCodigo, sondarCadastro: sondarCadastro,
    urlValores: urlValores,
    urlCadastro: urlCadastro,
    on: on
  };
})(window);

</script>
  <script>
/* ===== views-core.js ===== */
/* views-core.js — infraestrutura compartilhada pelas telas. Namespace `VW`. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI, ST = global.ST, API = global.API, CAT = global.CAT;

  var registradas = [];
  function registrar(v) {
    v.modulo = v.modulo || 'ifdata';
    registradas.push(v);
    return v;
  }
  function todas(modulo) {
    return modulo ? registradas.filter(function (v) { return v.modulo === modulo; }) : registradas;
  }

  /* --------------------------- guarda de render -------------------------- */

  /** Cada render de uma tela recebe uma geração; respostas de uma consulta
      anterior que cheguem atrasadas são descartadas em vez de sobrescrever a
      tela atual (a API faz retentativas e pode demorar dezenas de segundos). */
  function novaGeracao(node) {
    node.__gen = (node.__gen || 0) + 1;
    var minha = node.__gen;
    return function () { return node.__gen === minha; };
  }

  /* --------------------------- contexto atual --------------------------- */

  function ctx() {
    return {
      anoMes: ST.estado.anoMes,
      tipo: ST.estado.tipo,
      relatorio: ST.estado.relatorio,
      anualizar: ST.estado.anualizar
    };
  }

  /* ------------------------ carga do dataset ---------------------------- */

  /** Carrega o relatório do contexto e resolve os campos canônicos. */
  function carregar(opts) {
    var o = opts || {};
    var c = ctx();
    return API.valores(c.anoMes, c.tipo, c.relatorio).then(function (d) {
      var res = CAT.resolveFields(d.columns, ST.estado.overridesCampos);
      var dataset = {
        anoMes: c.anoMes, tipo: c.tipo, relatorio: c.relatorio,
        rows: d.rows, columns: d.columns, metaColumns: d.metaColumns,
        forma: d.forma, demo: !!d.demo, url: d.url, bruto: d.bruto, cadastro: d.cadastro || null,
        campos: res.map, scoreCampos: res.score, semUso: res.unmatched
      };
      return carregarSegmentos(c.anoMes, c.tipo, d.rows).then(function (mapa) {
        dataset.segmentos = mapa;
        dataset.temSegmento = mapa.size > 0;
        dataset.rowsCompletas = dataset.rows;
        if (escopoAtivo() && mapa.size) {
          dataset.rows = dataset.rows.filter(function (r) {
            var seg = mapa.get(r.__id);
            return seg === 'S1' || seg === 'S2';
          });
          dataset.escopoAplicado = true;
        }
        dataset.rows.forEach(function (r) {
          if (!r.__segmento) r.__segmento = mapa.get(r.__id) || null;
        });
        if (!o.naoGuardar) ST.set({ dataset: dataset }, 'dataset');
        return dataset;
      });
    });
  }

  /** Carrega o mesmo relatório em vários períodos. */
  function carregarSerie(periodos, onProgress) {
    var c = ctx();
    return API.serie(periodos, c.tipo, c.relatorio, onProgress).then(function (lista) {
      return lista.map(function (p) {
        var res = CAT.resolveFields(p.dados.columns || [], ST.estado.overridesCampos);
        return { anoMes: p.anoMes, erro: p.erro, rows: p.dados.rows || [],
                 columns: p.dados.columns || [], campos: res.map };
      });
    });
  }

  /* ---------------------------- escopo S1/S2 ----------------------------- */

  var cacheSegmentos = new Map();
  var segmentacaoIndisponivel = false;   // desiste de vez, não a cada período

  /** Lê o segmento prudencial (S1..S5) de uma linha, se ele estiver ali. */
  function segmentoDaLinha(row) {
    var campos = ['SR', 'Segmento', 'Segmentacao', 'TD', 'TC'];
    for (var i = 0; i < campos.length; i++) {
      var v = row[campos[i]];
      if (v == null) continue;
      var t = String(v).trim().toUpperCase();
      if (/^S[1-5]$/.test(t)) return t;
    }
    return null;
  }

  /**
   * Mapa código → segmento. Usa o que já veio no relatório em tela e, quando
   * ele não traz segmento, busca o relatório de Segmentação do mesmo período.
   * Falha silenciosa: sem segmento, o escopo simplesmente não filtra nada, em
   * vez de esvaziar a tela.
   */
  function carregarSegmentos(anoMes, tipo, rowsEmTela) {
    var chave = anoMes + '.' + tipo;

    var mapa = new Map();
    (rowsEmTela || []).forEach(function (r) {
      var seg = segmentoDaLinha(r);
      if (seg) mapa.set(r.__id, seg);
    });
    if (mapa.size) { cacheSegmentos.set(chave, Promise.resolve(mapa)); return cacheSegmentos.get(chave); }

    /* O cache guarda a PROMESSA, não o mapa: assim duas telas que carregam ao
       mesmo tempo compartilham uma única busca, em vez de cada uma disparar a
       sua antes que a primeira registre a desistência. */
    if (cacheSegmentos.has(chave)) return cacheSegmentos.get(chave);
    if (segmentacaoIndisponivel) {
      cacheSegmentos.set(chave, Promise.resolve(mapa));
      return cacheSegmentos.get(chave);
    }

    var promessa = API.valores(anoMes, tipo, '6').then(function (d) {
      d.rows.forEach(function (r) {
        var seg = segmentoDaLinha(r);
        if (!seg) {
          // o relatório de Segmentação pode trazer o segmento como coluna de dado
          d.columns.forEach(function (c) {
            var t = String(r[c] == null ? '' : r[c]).trim().toUpperCase();
            if (/^S[1-5]$/.test(t)) seg = t;
            if (!seg && /^s?[1-5]$/i.test(t) && /segment/.test(U.norm(c))) seg = 'S' + t.replace(/\D/g, '');
          });
        }
        if (seg) mapa.set(r.__id, seg);
      });
      if (!mapa.size) segmentacaoIndisponivel = true;
      return mapa;
    }).catch(function () {
      // O relatório de Segmentação não respondeu: registra a desistência para
      // não repetir a tentativa em cada um dos dezesseis trimestres da janela.
      segmentacaoIndisponivel = true;
      return mapa;
    });

    cacheSegmentos.set(chave, promessa);
    return promessa;
  }

  /** Volta a permitir a busca de segmentos (chamado ao limpar o cache). */
  function reiniciarSegmentos() {
    cacheSegmentos.clear();
    segmentacaoIndisponivel = false;
  }

  function escopoAtivo() { return ST.estado.escopoS1S2 !== false; }

  /* ------------------------ escala e formatação -------------------------- */

  var ESCALAS = [
    { value: '1', label: 'Como vem da API', hint: 'O IF.data publica os saldos em R$ mil.' },
    { value: '1000', label: '× 1.000 (para R$)', hint: 'Converte R$ mil em reais.' },
    { value: '0.001', label: '÷ 1.000 (para R$ milhões)', hint: 'Converte R$ mil em R$ milhões.' }
  ];

  var PAD_RAZAO = /(indice|razao|percentual|taxa|ratio|%|quantidade|numero|qtd)/;

  /** Colunas que são índices/contagens não devem ser reescaladas nem somadas. */
  function ehRazao(coluna) {
    var n = U.norm(coluna);
    if (/^(indice|razao)/.test(n)) return true;
    return PAD_RAZAO.test(n) && !/saldo|valor|carteira|ativo total/.test(n);
  }
  function ehContagem(coluna) {
    return /^(numero|quantidade|qtd)/.test(U.norm(coluna));
  }

  function escala() { return Number(ST.estado.escala || 1); }

  /** Acessor único de valor: aplica a escala apenas onde faz sentido. */
  function valor(linha, coluna) {
    if (!linha || !coluna) return null;
    var v = U.toNumber(linha[coluna]);
    if (!U.isNum(v)) return null;
    if (ehRazao(coluna) || ehContagem(coluna)) return v;
    return v * escala();
  }

  /** Formatador adequado ao tipo inferido da coluna. */
  function fmtColuna(coluna) {
    if (ehRazao(coluna) && !ehContagem(coluna)) {
      return function (v) { return U.isNum(v) ? U.fmt(v, 2) : '–'; };
    }
    if (ehContagem(coluna)) return function (v) { return U.isNum(v) ? U.fmt(v, 0) : '–'; };
    return function (v) { return U.compact(v, 1); };
  }
  function decimaisColuna(coluna) {
    if (ehContagem(coluna)) return 0;
    if (ehRazao(coluna)) return 2;
    return 0;
  }
  function unidadeColuna(coluna) {
    if (ehContagem(coluna)) return 'unidades';
    if (ehRazao(coluna)) return '%';
    return escala() === 1000 ? 'R$' : escala() === 0.001 ? 'R$ milhões' : 'R$ mil';
  }

  /* ----------------------------- utilidades ------------------------------ */

  function colunasNumericas(dataset) {
    if (!dataset) return [];
    return dataset.columns.filter(function (c) {
      return dataset.rows.some(function (r) { return U.isNum(U.toNumber(r[c])); });
    });
  }

  /** Coluna "principal" do relatório: ativo total quando existe, senão a de maior soma. */
  function campoPrincipal(dataset) {
    if (!dataset) return null;
    if (dataset.campos && dataset.campos.ativoTotal) return dataset.campos.ativoTotal;
    var cols = colunasNumericas(dataset).filter(function (c) { return !ehRazao(c); });
    if (!cols.length) return colunasNumericas(dataset)[0] || null;
    var melhor = null, maior = -Infinity;
    cols.forEach(function (c) {
      var s = U.sum(dataset.rows.map(function (r) { return U.toNumber(r[c]); }).filter(U.isNum));
      if (s > maior) { maior = s; melhor = c; }
    });
    return melhor;
  }

  function linhasPorId(dataset) {
    var m = new Map();
    (dataset.rows || []).forEach(function (r) { m.set(r.__id, r); });
    return m;
  }

  function linhasDoGrupo(dataset, grupo) {
    if (!dataset || !grupo) return [];
    var idx = linhasPorId(dataset);
    var porNome = new Map();
    (dataset.rows || []).forEach(function (r) { porNome.set(U.norm(r.__nome), r); });
    return grupo.membros.map(function (m) {
      return idx.get(String(m.id)) || porNome.get(U.norm(m.nome)) || null;
    }).filter(Boolean);
  }

  /** Padroniza uma lista de valores em escore-z (para heatmaps comparáveis). */
  function zscores(valores) {
    var v = valores.filter(U.isNum);
    var m = U.mean(v), s = U.stdev(v);
    if (!U.isNum(m) || !U.isNum(s) || s === 0) return valores.map(function () { return null; });
    return valores.map(function (x) { return U.isNum(x) ? (x - m) / s : null; });
  }

  /** Participação de cada valor no total (%). */
  function shares(valores) {
    var total = U.sum(valores.filter(function (v) { return U.isNum(v) && v > 0; }));
    return valores.map(function (v) { return U.isNum(v) && total ? (v / total) * 100 : null; });
  }

  /** Opções de instituição para os multiselects. */
  function opcoesInstituicoes(dataset, campoOrdem) {
    if (!dataset) return [];
    var campo = campoOrdem || campoPrincipal(dataset);
    return dataset.rows.slice()
      .sort(function (a, b) { return (valor(b, campo) || 0) - (valor(a, campo) || 0); })
      .map(function (r) {
        var v = valor(r, campo);
        return {
          value: r.__id,
          label: r.__nome,
          sub: (r.UF ? r.UF + ' · ' : '') + (campo ? fmtColuna(campo)(v) : '')
        };
      });
  }

  /* ---------------------------- blocos prontos ---------------------------- */

  function avisoDemo(dataset) {
    if (!dataset || !dataset.demo) return null;
    var comoSair = global.IFDATA_FORCAR_DEMO
      ? 'Esta cópia não tem como consultar o Banco Central: para dados reais, abra o sistema pelo endereço onde ele está hospedado.'
      : 'Troque para "API do BCB" na barra superior para consultar dados reais.';
    return UI.nota('Modo demonstração: os números são sintéticos e servem apenas para explorar a interface. ' +
      comoSair, 'warn');
  }

  /** Aviso quando o escopo S1/S2 está ligado mas o BCB não informou segmento. */
  function avisoEscopo(dataset) {
    if (!dataset || !escopoAtivo()) return null;
    if (dataset.temSegmento) return null;
    return UI.nota('O escopo S1/S2 está ligado, mas o Banco Central não informou o segmento ' +
      'prudencial para este período e tipo de instituição. Estão sendo exibidas todas as ' +
      'instituições do recorte.', 'warn');
  }

  function avisoCampos(dataset) {
    if (!dataset) return null;
    var faltando = ['ativoTotal', 'patrimonioLiquido', 'lucroLiquido'].filter(function (c) {
      return !dataset.campos[c];
    });
    if (!faltando.length) return null;
    return UI.nota('Este relatório não expõe ' +
      faltando.map(function (c) { return CAT.CAMPOS[c].label.toLowerCase(); }).join(', ') +
      '. Alguns indicadores ficam indisponíveis — use "Resumo" ou "Informações de Capital", ' +
      'ou ajuste o mapeamento em Diagnóstico.', 'warn');
  }

  function blocoCarregando(node, texto) {
    U.clear(node).appendChild(UI.carregando(texto));
  }

  function blocoErro(node, erro) {
    U.clear(node);
    var msg = (erro && erro.message) || String(erro);
    var ehRede = /Failed to fetch|NetworkError|load failed/i.test(msg);
    var eh500 = /HTTP 5\d\d/.test(msg);
    var c = ctx();
    var anterior = U.shiftPeriod(c.anoMes, -1);

    var explicacao;
    if (eh500) {
      explicacao = 'O Banco Central respondeu com erro interno. Na prática isso quase sempre ' +
        'significa que esta combinação de data-base, tipo de instituição e relatório não existe ' +
        'na base — o serviço devolve erro em vez de uma lista vazia. Também acontece quando o ' +
        'trimestre ainda não foi publicado.';
    } else if (ehRede) {
      explicacao = 'A requisição não chegou ao Banco Central. Causas comuns: rede corporativa ' +
        'bloqueando olinda.bcb.gov.br, ou a página aberta como arquivo local.';
    } else {
      explicacao = null;
    }

    var acoes = [];
    if (eh500) {
      acoes.push(U.el('button', {
        class: 'btn btn--primary', text: 'Tentar ' + U.periodLabel(anterior),
        onclick: function () {
          ST.set({ anoMes: anterior }); ST.salvarPrefs();
          global.APP.recarregar();
        }
      }));
      acoes.push(U.el('button', {
        class: 'btn', text: 'Ver quais trimestres existem',
        onclick: function () { global.APP.irPara('diagnostico'); }
      }));
    } else {
      acoes.push(U.el('button', { class: 'btn btn--sm', text: 'Ver diagnóstico',
        onclick: function () { global.APP.irPara('diagnostico'); } }));
    }
    acoes.push(U.el('button', {
      class: 'btn', text: 'Tentar de novo',
      onclick: function () { API.limparCache(); reiniciarSegmentos(); global.APP.recarregar(); }
    }));
    acoes.push(U.el('button', { class: 'btn btn--ghost', text: 'Modo demonstração',
      onclick: function () { global.APP.definirModo('demo'); } }));

    node.appendChild(UI.nota([
      U.el('div', {}, [
        U.el('strong', { text: 'Não foi possível carregar os dados. ' }),
        U.el('span', { text: U.periodLong(c.anoMes) + ' · tipo ' + c.tipo + ' · relatório ' + c.relatorio })
      ]),
      explicacao ? U.el('div', { class: 'small', style: 'margin-top:6px', text: explicacao }) : null,
      U.el('div', { class: 'small muted', style: 'margin-top:6px', text: 'Resposta do servidor: ' + msg }),
      U.el('div', { class: 'row', style: 'margin-top:10px' }, acoes)
    ], 'bad'));
  }

  /** Linha de estatísticas resumidas no topo de uma tela. */
  function faixaStats(itens) {
    var box = U.el('div', { class: 'grid grid--stats', style: 'margin-bottom:16px' });
    itens.filter(Boolean).forEach(function (it) { box.appendChild(UI.stat(it)); });
    return box;
  }

  global.VW = {
    registrar: registrar, todas: todas, ctx: ctx, novaGeracao: novaGeracao,
    segmentoDaLinha: segmentoDaLinha, carregarSegmentos: carregarSegmentos,
    escopoAtivo: escopoAtivo, avisoEscopo: avisoEscopo, reiniciarSegmentos: reiniciarSegmentos,
    carregar: carregar, carregarSerie: carregarSerie,
    ESCALAS: ESCALAS, escala: escala, valor: valor, ehRazao: ehRazao, ehContagem: ehContagem,
    fmtColuna: fmtColuna, decimaisColuna: decimaisColuna, unidadeColuna: unidadeColuna,
    colunasNumericas: colunasNumericas, campoPrincipal: campoPrincipal,
    linhasPorId: linhasPorId, linhasDoGrupo: linhasDoGrupo,
    zscores: zscores, shares: shares, opcoesInstituicoes: opcoesInstituicoes,
    avisoDemo: avisoDemo, avisoCampos: avisoCampos,
    blocoCarregando: blocoCarregando, blocoErro: blocoErro, faixaStats: faixaStats
  };
})(window);

</script>
  <script>
/* ===== views-dados.js ===== */
/* views-dados.js — telas Consulta, Comparação e Série temporal. */
(function (global) {
  'use strict';
  var U = global.U, UI = global.UI, ST = global.ST, CH = global.CH,
      TBL = global.TBL, CAT = global.CAT, VW = global.VW;

  /* =====================================================================
     Tela 1 — Consulta e tabelas
     ===================================================================== */

  VW.registrar({
    id: 'consulta',
    titulo: 'Consulta',
    descricao: 'Escolha período, tipo de instituição e relatório; veja o ranking e a tabela completa.',
    montar: function (node) {
      var local = { coluna: null, topN: 20, uf: '', segmento: '' };

      function render() {
        var atual = VW.novaGeracao(node);
        VW.blocoCarregando(node, 'Consultando o IF.data…');
        VW.carregar()
          .then(function (ds) { if (atual()) pintar(ds); })
          .catch(function (e) { if (atual()) VW.blocoErro(node, e); });
      }

      function pintar(ds) {
        U.clear(node);
        var aviso = VW.avisoDemo(ds); if (aviso) node.appendChild(aviso);

        if (!ds.rows.length) {
          node.appendChild(UI.vazio('Nenhum registro neste recorte',
            'O período ' + U.periodLong(ds.anoMes) + ' pode não estar publicado para este relatório. ' +
            'Tente um trimestre anterior ou use "Detectar períodos" em Diagnóstico.'));
          return;
        }

        var numericas = VW.colunasNumericas(ds);
        if (!local.coluna || numericas.indexOf(local.coluna) < 0) local.coluna = VW.campoPrincipal(ds);

        /* --- controles da tela ------------------------------------------ */
        var ufs = U.unique(ds.rows.map(function (r) { return r.UF; }).filter(Boolean)).sort();
        var segs = U.unique(ds.rows.map(function (r) { return r.SR || r.Segmento; }).filter(Boolean)).sort();

        var barra = U.el('div', { class: 'filterbar' });
        barra.appendChild(UI.campo('Coluna analisada', UI.seletor(
          numericas.map(function (c) { return { value: c, label: c }; }),
          local.coluna, function (v) { local.coluna = v; pintar(ds); }, { style: 'min-width:260px' })));
        barra.appendChild(UI.campo('Top N', UI.seletor(
          [5, 10, 15, 20, 30, 50].map(function (n) { return { value: String(n), label: String(n) }; }),
          String(local.topN), function (v) { local.topN = Number(v); pintar(ds); })));
        if (ufs.length > 1) {
          barra.appendChild(UI.campo('UF', UI.seletor(
            [{ value: '', label: 'Todas' }].concat(ufs.map(function (u) { return { value: u, label: u }; })),
            local.uf, function (v) { local.uf = v; pintar(ds); })));
        }
        if (segs.length > 1) {
          barra.appendChild(UI.campo('Segmento', UI.seletor(
            [{ value: '', label: 'Todos' }].concat(segs.map(function (s) { return { value: s, label: s }; })),
            local.segmento, function (v) { local.segmento = v; pintar(ds); })));
        }
        barra.appendChild(U.el('div', { class: 'filterbar__actions' }, [
          U.el('button', { class: 'btn btn--sm', text: 'Criar conjunto com o Top ' + local.topN,
            title: 'Salva as instituições exibidas como um conjunto reutilizável',
            onclick: function () { criarConjuntoDoTop(); } })
        ]));
        node.appendChild(barra);

        /* --- filtro aplicado -------------------------------------------- */
        var linhas = ds.rows.filter(function (r) {
          if (local.uf && r.UF !== local.uf) return false;
          if (local.segmento && (r.SR || r.Segmento) !== local.segmento) return false;
          return true;
        });

        var valores = linhas.map(function (r) { return VW.valor(r, local.coluna); });
        var validos = valores.filter(U.isNum);
        var total = U.sum(validos);
        var ordenadas = linhas.slice().sort(function (a, b) {
          return (VW.valor(b, local.coluna) || -Infinity) - (VW.valor(a, local.coluna) || -Infinity);
        });
        var top = ordenadas.slice(0, local.topN);
        var razao = VW.ehRazao(local.coluna);
        var fmt = VW.fmtColuna(local.coluna);

        /* --- stat tiles -------------------------------------------------- */
        var top5 = U.sum(ordenadas.slice(0, 5).map(function (r) { return VW.valor(r, local.coluna); }).filter(U.isNum));
        var indice = razao ? null : U.hhi(validos);
        node.appendChild(VW.faixaStats([
          { label: 'Instituições no recorte', valor: U.fmt(linhas.length, 0),
            nota: U.periodLong(ds.anoMes) },
          razao
            ? { label: 'Mediana de ' + U.truncate(local.coluna, 26), valor: fmt(U.median(validos)),
                nota: 'Média ' + fmt(U.mean(validos)) }
            : { label: 'Total do sistema', valor: fmt(total),
                nota: local.coluna + ' · ' + VW.unidadeColuna(local.coluna) },
          razao
            ? { label: 'Dispersão (desvio-padrão)', valor: fmt(U.stdev(validos)),
                nota: 'p10 ' + fmt(U.quantile(validos, .1)) + ' · p90 ' + fmt(U.quantile(validos, .9)) }
            : { label: 'Concentração top 5', valor: U.pct(total ? (top5 / total) * 100 : null, 1),
                nota: 'Participação das cinco maiores' },
          indice
            ? { label: 'HHI', valor: U.fmt(indice, 0),
                nota: indice > 2500 ? 'Mercado concentrado (>2.500)'
                     : indice > 1500 ? 'Moderadamente concentrado' : 'Pouco concentrado (<1.500)' }
            : { label: 'Cobertura do dado', valor: U.pct(linhas.length ? (validos.length / linhas.length) * 100 : null, 0),
                nota: validos.length + ' de ' + linhas.length + ' instituições informaram' }
        ]));

        /* --- ranking ------------------------------------------------------ */
        var gr = UI.grafico({
          titulo: 'Top ' + Math.min(local.topN, top.length) + ' — ' + local.coluna,
          sub: U.periodLong(ds.anoMes) + ' · ' + VW.unidadeColuna(local.coluna) +
               (local.uf ? ' · UF ' + local.uf : '') + (local.segmento ? ' · ' + local.segmento : '')
        });
        CH.Colors.rebase(top.slice(0, 8).map(function (r) { return r.__id; }));
        CH.ranking(gr.grafico, {
          data: top.map(function (r) {
            var v = VW.valor(r, local.coluna);
            return {
              key: r.__id, label: r.__nome, value: v,
              color: 'var(--series-1)',
              nota: !razao && total ? 'Participação: ' + U.pct((v / total) * 100, 2) : null
            };
          }),
          serieLabel: local.coluna,
          fmtValor: fmt, fmtEixo: fmt,
          aria: 'Ranking das maiores instituições por ' + local.coluna
        });
        TBL.render(gr.tabela, {
          columns: [
            { key: 'pos', label: '#', tipo: 'num', decimais: 0 },
            { key: 'nome', label: 'Instituição', sticky: true, largura: 240 },
            { key: 'valor', label: local.coluna, tipo: 'num', decimais: VW.decimaisColuna(local.coluna) },
            { key: 'share', label: 'Part. %', tipo: 'num', decimais: 2 }
          ],
          rows: top.map(function (r, i) {
            var v = VW.valor(r, local.coluna);
            return { pos: i + 1, nome: r.__nome, valor: v,
                     share: !razao && total && U.isNum(v) ? (v / total) * 100 : null };
          }),
          ordenar: { key: 'pos', dir: 'asc' },
          nomeArquivo: 'ifdata-top-' + U.slug(local.coluna) + '-' + ds.anoMes
        });
        node.appendChild(gr.node);

        /* --- tabela completa ---------------------------------------------- */
        var cartao = UI.card({
          titulo: 'Tabela completa do relatório',
          sub: ds.columns.length + ' colunas · ' + linhas.length + ' instituições · forma do retorno: ' + ds.forma,
          flush: true
        });
        var colunasVisiveis = numericas.slice(0, 12);
        var seletorColunas = UI.multiselect({
          opcoes: numericas.map(function (c) { return { value: c, label: c }; }),
          selecionados: colunasVisiveis,
          placeholder: 'Colunas exibidas…',
          onChange: function (vals) { colunasVisiveis = vals.length ? vals : numericas.slice(0, 12); montarTabela(); }
        });
        seletorColunas.node.style.minWidth = '320px';
        seletorColunas.node.style.maxWidth = '520px';
        seletorColunas.node.querySelector('.ms__control').style.maxHeight = '82px';
        seletorColunas.node.querySelector('.ms__control').style.overflowY = 'auto';
        cartao.tools.appendChild(seletorColunas.node);
        var alvoTabela = U.el('div');
        cartao.corpo.appendChild(alvoTabela);

        function montarTabela() {
          TBL.render(alvoTabela, {
            columns: [{ key: '__nome', label: 'Instituição', sticky: true, largura: 240 }]
              .concat(ds.metaColumns.filter(function (m) { return ['UF', 'Cidade', 'SR', 'Segmento'].indexOf(m) >= 0; })
                .map(function (m) { return { key: m, label: m, largura: 80 }; }))
              .concat(colunasVisiveis.map(function (c) {

            .slice(0, 5).map(function (r) { return r.__id; });
        }
        local.ifs = local.ifs.filter(function (id) { return idx.has(id); });
        if (!local.colunas.length) local.colunas = numericas.slice(0, 4);

        /* --- controles ---------------------------------------------------- */

        barra.appendChild(UI.campo('Colunas comparadas (até 8)', msCols.node, 'grow'));

          });
          CH.colunas(gr.grafico, {

            series: selecionadas.map(function (r) {

                values: local.colunas.map(function (c) {
                  var vals = selecionadas.map(function (x) { return VW.valor(x, c); }).filter(U.isNum);
                  var max = vals.length ? Math.max.apply(null, vals.map(Math.abs)) : 0;
                  var v = VW.valor(r, c);

              };

            fmtEixo: function (v) { return U.fmt(v, 0); },
            fmtValor: function (v) { return U.fmt(v, 1) + ' (base 100)'; },
            tituloEixo: 'Índice',

          });
          tabelaComparativa(gr.tabela, ds, selecionadas, local.colunas);
          node.appendChild(gr.node);
        } else {
          var grade = U.el('div', { class: 'grid grid--2' });
          local.colunas.forEach(function (c) {
            var g = UI.grafico({ titulo: c, sub: VW.unidadeColuna(c) + ' · ' + U.periodLabel(ds.anoMes) });
            var dados = selecionadas.map(function (r) {
              return { key: r.__id, label: r.__nome, value: VW.valor(r, c), color: CH.Colors.of(r.__id) };
            }).sort(function (a, b) { return (b.value || -Infinity) - (a.value || -Infinity); });
            CH.ranking(g.grafico, {
              data: dados, serieLabel: c, alturaLinha: 28,
              fmtValor: VW.fmtColuna(c), fmtEixo: VW.fmtColuna(c),
              aria: 'Comparação de ' + c
            });
            TBL.render(g.tabela, {
              columns: [{ key: 'nome', label: 'Instituição', sticky: true, largura: 200 },
                        { key: 'valor', label: c, tipo: 'num', decimais: VW.decimaisColuna(c) }],
              rows: dados.map(function (d) { return { nome: d.label, valor: d.value }; }),
              busca: false, nomeArquivo: 'comparar-' + U.slug(c)
            });
            grade.appendChild(g.node);
          });
          node.appendChild(grade);
        }

        /* --- heatmap de indicadores ---------------------------------------- */
        var disponiveis = CAT.indicadoresDisponiveis(ds.campos);
        if (disponiveis.length >= 2) {
          var ctxCalc = { anoMes: ds.anoMes, anualizar: ST.estado.anualizar };
          var matriz = selecionadas.map(function (r) { return CAT.calcIndicadores(r, ds.campos, ctxCalc); });
          var porIndicador = {};
          disponiveis.forEach(function (m) {
            porIndicador[m.id] = VW.zscores(matriz.map(function (linha) { return linha[m.id]; }));
          });
          var gh = UI.grafico({
            titulo: 'Posição relativa por indicador',
            sub: 'Escore-z dentro do grupo selecionado — azul abaixo da média do grupo, vermelho acima. ' +
                 'Use a aba Tabela para os valores absolutos.'
          });
          CH.heatmap(gh.grafico, {
            rows: selecionadas.map(function (r) { return { key: r.__id, label: r.__nome }; }),
            cols: disponiveis.map(function (m) { return { key: m.id, label: m.label }; }),
            values: selecionadas.map(function (_, i) {
              return disponiveis.map(function (m) { return porIndicador[m.id][i]; });
            }),
            escala: 'divergente', mostrarValor: true, alturaCelula: 30,
            fmtValor: function (v) { return U.isNum(v) ? U.signed(v, 1) + ' σ' : '–'; },
            aria: 'Matriz de posição relativa por indicador'
          });
          TBL.render(gh.tabela, {
            columns: [{ key: 'nome', label: 'Instituição', sticky: true, largura: 220 }]
              .concat(disponiveis.map(function (m) {
                return { key: m.id, label: m.label + ' (' + m.unidade + ')', tipo: 'num', decimais: m.decimais,
                         hint: m.desc };
              })),
            rows: selecionadas.map(function (r, i) {
              var o = { nome: r.__nome };
              disponiveis.forEach(function (m) { o[m.id] = matriz[i][m.id]; });
              return o;
            }),
            busca: false, nomeArquivo: 'comparar-indicadores-' + ds.anoMes
          });
          node.appendChild(gh.node);
        } else {
          var av = VW.avisoCampos(ds); if (av) node.appendChild(av);
        }

        /* --- tabela consolidada -------------------------------------------- */
        var cartao = UI.card({ titulo: 'Tabela comparativa', sub: 'Todas as colunas selecionadas', flush: true });
        var alvo = U.el('div'); cartao.corpo.appendChild(alvo);
        tabelaComparativa(alvo, ds, selecionadas, local.colunas);
        node.appendChild(cartao.node);
      }

      function tabelaComparativa(alvo, ds, linhas, colunas) {
        TBL.render(alvo, {
          columns: [{ key: 'nome', label: 'Instituição', sticky: true, largura: 240 }]
            .concat(colunas.map(function (c) {
              return { key: c, label: c, tipo: 'num', decimais: VW.decimaisColuna(c),
                       fmt: function (v) { return VW.fmtColuna(c)(v); } };
            })),
          rows: linhas.map(function (r) {
            var o = { nome: r.__nome };
            colunas.forEach(function (c) { o[c] = VW.valor(r, c); });
            return o;
          }),
          busca: false, nomeArquivo: 'ifdata-comparativo-' + ds.anoMes
        });
      }

      render();
      return { atualizar: render };
    }
  });
