<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Bench — Monitor de instituições financeiras</title>
  <meta name="description" content="Risk Bench: monitor de rentabilidade, risco de mercado, liquidez, capital e RWA de bancos S1 e S2, sobre o IF.data do Banco Central e as publicações trimestrais.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232a78d6'/><rect x='22' y='52' width='13' height='28' rx='4' fill='white'/><rect x='43' y='36' width='13' height='44' rx='4' fill='white'/><rect x='64' y='20' width='13' height='60' rx='4' fill='white'/></svg>">
  <style>
/* ==========================================================================
   IF.data Analytics — folha de estilo
   Paleta de séries validada (contraste + CVD) — ver README §Design
   ========================================================================== */

:root {
  color-scheme: dark;

  /* Tema escuro único e deliberado: o Risk Bench é operado em sala de risco,
     lado a lado com terminais. Toda cor é pintada explicitamente — a página
     nunca herda o fundo do hospedeiro. */
  --plane:          #0d0d0d;
  --surface-1:      #1a1a19;
  --surface-2:      #232322;
  --surface-sunk:   #141413;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255, 255, 255, .10);
  --border-strong:  rgba(255, 255, 255, .20);
  --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.8);

  /* categóricas — ordem fixa, atribuída por entidade (nunca por posição/rank).
     Passa contraste e as três formas de daltonismo sobre esta superfície. */
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;

  /* sequencial (magnitude) — azul, escuro→claro no fundo escuro */
  --seq-100: #0d366b; --seq-200: #184f95; --seq-300: #256abf; --seq-400: #3987e5;
  --seq-500: #6da7ec; --seq-600: #9ec5f4; --seq-700: #cde2fb;

  /* divergente (polaridade) — dois polos opostos, cinza neutro no meio */
  --div-neg: #3987e5;
  --div-mid: #383835;
  --div-pos: #d03b3b;

  /* status — reservado, nunca usado como série */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --delta-up: #0ca30c;

  --accent:      #3987e5;
  --accent-soft: #16283d;

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

/* O atributo hidden tem de vencer o display dos componentes: sem isto, uma
   .filterbar escondida continua ocupando espaço por causa do display:flex. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--plane);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 .75em; }
a { color: var(--accent); }

/* ---------- layout ---------------------------------------------------- */

.app { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand__mark {
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  padding: 3px 9px; border-radius: var(--r-sm);
  background: var(--accent); color: #fff; white-space: nowrap;
}
.brand__sub { font-size: 12px; color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.topbar__spacer { flex: 1 1 auto; }
.topbar__tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.tabs {
  display: flex; gap: 2px; padding: 0 12px; overflow-x: auto;
  background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 53px; z-index: 39;
  scrollbar-width: thin;
}
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 500; color: var(--text-secondary);
  padding: 11px 14px 9px; border-bottom: 2px solid transparent;
  white-space: nowrap; border-radius: var(--r-sm) var(--r-sm) 0 0;
}
.tab:hover { color: var(--text-primary); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.main { flex: 1 1 auto; padding: 16px 20px 64px; max-width: 1600px; width: 100%; margin: 0 auto; }
.view[hidden] { display: none !important; }

/* ---------- barra global de filtros ----------------------------------- */

.filterbar {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
  padding: 12px 14px; margin-bottom: 16px;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow);
}
.filterbar__group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filterbar__group--grow { flex: 1 1 260px; }
.filterbar__actions { display: flex; gap: 8px; margin-left: auto; }

.field-label {
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-muted);
}

/* ---------- controles ------------------------------------------------- */

select, input[type="text"], input[type="number"], input[type="search"], textarea {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  padding: 6px 9px; min-width: 0; max-width: 100%;
}
select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
select { cursor: pointer; }

.btn {
  appearance: none; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; min-height: 32px;
  color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn--primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn--ghost { border-color: transparent; background: none; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text-primary); }
.btn--danger { color: var(--critical); border-color: var(--border-strong); }
.btn--danger:hover { background: var(--surface-2); }
.btn--sm { min-height: 26px; padding: 3px 9px; font-size: 12px; }

.seg { display: inline-flex; background: var(--surface-sunk); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
.seg button {
  appearance: none; border: 0; background: none; font: inherit; font-size: 12px;
  cursor: pointer; padding: 4px 10px; border-radius: 4px; color: var(--text-secondary);
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }

.switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
  color: var(--text-secondary); cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

/* ---------- multiselect ----------------------------------------------- */

.ms { position: relative; }
.ms__control {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  min-height: 32px; padding: 3px 6px; cursor: text;
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
}
.ms__control:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.ms__input { flex: 1 1 90px; border: 0 !important; background: none !important;
  padding: 2px !important; min-width: 70px; font-size: 13px; }
.ms__panel {
  position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 300px; overflow-y: auto;
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); box-shadow: var(--shadow); padding: 4px;
}
.ms__panel[hidden] { display: none; }
.ms__opt {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: var(--r-sm); cursor: pointer; font-size: 13px; line-height: 1.3;
}
.ms__opt:hover, .ms__opt.is-active { background: var(--surface-2); }
.ms__opt[aria-selected="true"] { background: var(--accent-soft); }
.ms__opt small { color: var(--text-muted); font-size: 11px; }
.ms__empty { padding: 10px; color: var(--text-muted); font-size: 12px; text-align: center; }
.ms__bulk { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--surface-1); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 4px 2px 8px; border-radius: 999px; font-size: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  max-width: 260px;
}
.chip__dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.chip__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip__x {
  appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
  color: var(--text-muted); line-height: 1; padding: 3px 5px; border-radius: 50%;
  min-width: 22px; min-height: 22px; display: inline-flex; align-items: center; justify-content: center;
}
.chip__x:hover { background: var(--border); color: var(--text-primary); }

/* ---------- cards ------------------------------------------------------ */

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow);
  margin-bottom: 16px; overflow: hidden;
}
.card__head {
  display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px 10px;
}
.card__title { font-size: 14px; font-weight: 600; }
.card__sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.card__tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card__body { padding: 0 14px 14px; }
.card__body--flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid--stats { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

/* ---------- stat tiles ------------------------------------------------- */

.stat {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 12px 14px;
}
.stat__label { font-size: 12px; color: var(--text-secondary); }
.stat__value { font-size: 24px; font-weight: 600; margin-top: 2px; letter-spacing: -.015em; }
.stat__delta { font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.stat__delta--up { color: var(--delta-up); }
.stat__delta--down { color: var(--critical); }
.stat__delta--flat { color: var(--text-muted); }
.stat__note { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.stat__spark { margin-top: 8px; height: 30px; }

.hero { padding: 4px 0 8px; }
.hero__value { font-size: 48px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
.hero__label { font-size: 13px; color: var(--text-secondary); }

/* ---------- tabelas ---------------------------------------------------- */

.tablewrap { overflow: auto; max-height: 620px; border-top: 1px solid var(--border); }
table.dt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.dt th, table.dt td { padding: 7px 10px; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--grid); }
table.dt thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2);
  font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-secondary); cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--axis);
}
table.dt thead th:hover { color: var(--text-primary); }
table.dt thead th .sort { color: var(--accent); margin-left: 4px; font-size: 10px; }
table.dt td.num, table.dt th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.dt tbody tr:hover td { background: var(--surface-2); }
table.dt td.sticky, table.dt th.sticky { position: sticky; left: 0; z-index: 1;
  background: var(--surface-1); border-right: 1px solid var(--grid); }
table.dt thead th.sticky { z-index: 3; background: var(--surface-2); }
table.dt tbody tr:hover td.sticky { background: var(--surface-2); }
table.dt td.neg { color: var(--critical); }
.dt-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; font-size: 12px; color: var(--text-muted);
  border-top: 1px solid var(--border); background: var(--surface-1); }

/* ---------- gráficos --------------------------------------------------- */

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart__empty { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

.tick { font-size: 11px; fill: var(--text-muted); }
.axis-title { font-size: 11px; fill: var(--text-secondary); font-weight: 500; }
.mark-label { font-size: 11px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
.mark-label--strong { fill: var(--text-primary); font-weight: 600; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 4px 2px 10px; }
.legend__item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  color: var(--text-secondary); cursor: pointer; border-radius: var(--r-sm); padding: 1px 4px; }
.legend__item:hover { background: var(--surface-2); color: var(--text-primary); }
.legend__item.is-off { opacity: .4; }
.legend__swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.legend__swatch--line { width: 14px; height: 3px; border-radius: 2px; }

.tip {
  position: fixed; z-index: 200; pointer-events: none;
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm); box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px; max-width: 320px;
  transition: opacity .08s linear;
}
.tip[hidden] { display: none; }
.tip__title { font-weight: 600; margin-bottom: 4px; }
.tip__row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip__row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip__key { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tip__note { color: var(--text-muted); margin-top: 4px; font-size: 11px; }

/* ---------- avisos, badges, estados ------------------------------------ */

.note {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--r-md); font-size: 13px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  margin-bottom: 14px;
}
.note__icon { flex: 0 0 auto; font-weight: 700; }
.note--warn  { border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.note--warn .note__icon { color: var(--warning); }
.note--bad   { border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
.note--bad .note__icon { color: var(--critical); }
.note--good  { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.note--good .note__icon { color: var(--good); }

.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
  padding: 1px 7px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border);
}
.badge--live { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.badge--demo { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }

.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 6px; }

.loading { display: flex; align-items: center; gap: 10px; padding: 32px; justify-content: center;
  color: var(--text-secondary); font-size: 13px; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.is-refetching { opacity: .5; transition: opacity .12s; }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

/* ---------- toasts ------------------------------------------------------ */

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast {
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px;
}
.toast--bad { border-left-color: var(--critical); }
.toast--good { border-left-color: var(--good); }
.toast--warn { border-left-color: var(--warning); }

/* ---------- modal ------------------------------------------------------- */

.modal { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal__scrim { position: absolute; inset: 0; background: rgba(11,11,11,.42); }
.modal__box {
  position: relative; background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow);
  width: min(720px, 100%); max-height: 86vh; overflow: auto; padding: 18px;
}
.modal__title { font-size: 16px; margin-bottom: 4px; }
.modal__foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ---------- grupos ------------------------------------------------------ */

.grouplist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.groupcard {
  border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px;
  background: var(--surface-1); display: flex; flex-direction: column; gap: 8px;
}
.groupcard.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.groupcard__title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.groupcard__members { font-size: 12px; color: var(--text-secondary);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.groupcard__foot { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }

.mono { font-family: var(--mono); font-size: 12px; }
.pre {
  font-family: var(--mono); font-size: 11.5px; white-space: pre; overflow: auto;
  background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px; max-height: 320px;
}
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row--tight { gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ---------- responsivo -------------------------------------------------- */

/* nada além de tabelas, gráficos e blocos <pre> pode empurrar a página
   horizontalmente — cada um deles tem o próprio contêiner com rolagem */
.filterbar__group, .card__tools > .ms { max-width: 100%; min-width: 0; }
.filterbar select, .filterbar input, .filterbar .ms { max-width: 100%; }

@media (max-width: 900px) {
  .card__tools { width: 100%; margin-left: 0; }
  .card__tools > .ms { min-width: 0 !important; max-width: 100% !important; flex: 1 1 100%; }
}

@media (max-width: 720px) {
  .main { padding: 12px 16px 56px; }
  .topbar { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
  .topbar__spacer { display: none; }
  .topbar__tools { width: 100%; flex-wrap: wrap; }
  .tabs { top: auto; position: static; }
  .grid--2, .grid--3 { grid-template-columns: 1fr; }
  .filterbar { padding: 10px; }
  .filterbar__group { flex: 1 1 100%; }
  .filterbar select, .filterbar input, .filterbar .ms {
    min-width: 0 !important; max-width: 100% !important; width: 100%;
  }
  .filterbar__actions { margin-left: 0; width: 100%; }
  .hero__value { font-size: 36px; }
  .modal__box { padding: 14px; }
}

@media print {
  .topbar, .tabs, .filterbar, .card__tools, .toasts { display: none !important; }
  .card { break-inside: avoid; box-shadow: none; }
}

/* ==========================================================================
   Risk Bench — navegação por módulo e telas de publicações
   ========================================================================== */

.brand__modulo {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-muted); padding-left: 10px; margin-left: 2px;
  border-left: 1px solid var(--border-strong);
}

/* matriz de cobertura: banco × fonte */
.matriz { overflow-x: auto; }
.matriz table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
.matriz th, .matriz td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.matriz thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2);
  font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-secondary); text-align: center;
}
.matriz td.banco, .matriz th.banco {
  position: sticky; left: 0; z-index: 1; background: var(--surface-1);
  text-align: left; border-right: 1px solid var(--grid); min-width: 220px;
}
.matriz thead th.banco { z-index: 3; background: var(--surface-2); }
.matriz td.celula { text-align: center; }

/* pastilha de cobertura — forma + texto, nunca só cor */
.cob {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: 42px; padding: 2px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--border-strong); color: var(--text-secondary);
  background: var(--surface-2);
}
.cob--cheia { border-color: color-mix(in srgb, var(--good) 60%, transparent); color: var(--good); }
.cob--parcial { border-color: color-mix(in srgb, var(--warning) 60%, transparent); color: var(--warning); }
.cob--vazia { opacity: .45; }

/* apontamento de divergência */
.div-lista { display: flex; flex-direction: column; gap: 8px; }
.div-item {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: baseline;
  padding: 10px 12px; border: 1px solid var(--border); border-left-width: 3px;
  border-radius: var(--r-md); background: var(--surface-1);
}
.div-item--alta { border-left-color: var(--critical); }
.div-item--media { border-left-color: var(--warning); }
.div-item--baixa { border-left-color: var(--text-muted); }
.div-item__metrica { font-weight: 600; font-size: 13px; }
.div-item__contexto { font-size: 12px; color: var(--text-muted); grid-column: 1 / -1; }
.div-item__valor { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
.div-item__gap { font-weight: 600; }

/* fichas de fonte por banco */
.fontes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.fonte-card {
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-1); padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.fonte-card__nome { font-weight: 600; font-size: 13.5px; }
.fonte-card__links { display: flex; flex-wrap: wrap; gap: 6px; }
.fonte-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-secondary); text-decoration: none;
}
.fonte-link:hover { background: var(--surface-2); color: var(--text-primary); }

/* formulário de lançamento */
.form-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.form-grid .field-label { margin: 0; }

.familia-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-strong);
  color: var(--text-secondary);
}

    { id: '5',  nome: 'Informações de Capital' },
    { id: '6',  nome: 'Segmentação' },
    { id: '7',  nome: 'Carteira de crédito ativa Pessoa Física – por modalidade e prazo' },
    { id: '8',  nome: 'Carteira de crédito ativa Pessoa Jurídica – por modalidade e prazo' },
    { id: '9',  nome: 'Carteira de crédito ativa Pessoa Jurídica – por porte do tomador' },
    { id: '10', nome: 'Carteira de crédito ativa Pessoa Jurídica – por atividade econômica (CNAE)' },
    { id: '11', nome: 'Carteira de crédito ativa – por nível de risco da operação' },
    { id: '12', nome: 'Carteira de crédito ativa – quantidade de clientes e de operações' },
    { id: '13', nome: 'Carteira de crédito ativa Pessoa Física – por indexador' },
    { id: '14', nome: 'Carteira de crédito ativa Pessoa Jurídica – por indexador' },
    { id: '15', nome: 'Carteira de crédito ativa – por região geográfica' },
    { id: '16', nome: 'Carteira de crédito ativa – por porte do tomador' },
    { id: '17', nome: 'Carteira de crédito ativa – por origem dos recursos' }
  ];

  /* ---------------------------------------------------------------------
     Campos canônicos: cada um traz padrões de nome (já normalizados) que
     são casados contra as colunas realmente devolvidas pela API. Isso deixa
     os indicadores imunes a mudanças de rótulo entre períodos/relatórios.
     `exact` casa nome idêntico; `starts` casa prefixo; `has` exige todos os
     termos presentes; `not` descarta.
     --------------------------------------------------------------------- */
  var CAMPOS = {
    ativoTotal: {
      label: 'Ativo total',
      exact: ['ativo total', 'ativo'],
      starts: ['ativo total'],
      has: [['ativo', 'total']],
      not: ['ponderado', 'permanente', 'realizavel', 'circulante']
    },
    carteiraCredito: {
      label: 'Carteira de crédito',
      exact: ['carteira de credito classificada', 'carteira de credito', 'operacoes de credito'],
      starts: ['carteira de credito classificada', 'carteira de credito'],
      has: [['carteira', 'credito']],
      not: ['pessoa fisica', 'pessoa juridica', 'liquida']
    },
    passivoTotal: {
      label: 'Passivo total',
      exact: ['passivo total', 'passivo circulante e exigivel a longo prazo', 'passivo'],
      has: [['passivo', 'total']], not: ['ponderado']
    },
    captacoes: {
      label: 'Captações',
      exact: ['captacoes', 'captacoes totais', 'total de captacoes'],
      starts: ['captacoes'], has: [['captac']]
    },
    depositos: {
      label: 'Depósitos',
      exact: ['depositos', 'depositos totais', 'total de depositos'],
      starts: ['depositos'], has: [['deposito']], not: ['compulsorio', 'interfinanceiro']
    },
    patrimonioLiquido: {
      label: 'Patrimônio líquido',
      exact: ['patrimonio liquido', 'patrimonio liquido ajustado'],
      starts: ['patrimonio liquido'], has: [['patrimonio', 'liquido']], not: ['referencia']
    },
    lucroLiquido: {
      label: 'Lucro líquido',
      exact: ['lucro liquido', 'lucro prejuizo liquido', 'resultado liquido'],
      starts: ['lucro liquido', 'lucro prejuizo'], has: [['lucro', 'liquido']]
    },
    basileia: {
      label: 'Índice de Basileia',
      exact: ['indice de basileia', 'indice de basileia ib'],
      starts: ['indice de basileia'], has: [['basileia']], ratio: true
    },
    indiceCapitalPrincipal: {
      label: 'Índice de Capital Principal',
      exact: ['indice de capital principal'], has: [['indice', 'capital', 'principal']], ratio: true
    },
    indiceNivelI: {
      label: 'Índice de Capital Nível I',
      exact: ['indice de capital nivel i', 'indice de nivel i'],
      has: [['indice', 'nivel']], ratio: true
    },
    razaoAlavancagem: {
      label: 'Razão de alavancagem',
      exact: ['razao de alavancagem', 'razao de alavancagem ra'],
      has: [['razao', 'alavancagem']], ratio: true
    },
    indiceImobilizacao: {
      label: 'Índice de imobilização',
      exact: ['indice de imobilizacao'], has: [['indice', 'imobiliza']], ratio: true
    },
    patrimonioReferencia: {
      label: 'Patrimônio de Referência',
      exact: ['patrimonio de referencia', 'patrimonio de referencia pr'],
      has: [['patrimonio', 'referencia']]
    },
    capitalPrincipal: {
      label: 'Capital Principal',
      exact: ['capital principal'], has: [['capital', 'principal']], not: ['indice']
    },
    capitalNivelI: {
      label: 'Capital Nível I',
      exact: ['nivel i', 'capital de nivel i', 'capital nivel i'],
      has: [['nivel', 'i']], not: ['indice', 'nivel ii']
    },
    rwa: {
      label: 'RWA (ativos ponderados pelo risco)',
      exact: ['ativos ponderados pelo risco rwa', 'rwa', 'ativos ponderados pelo risco',
              'montante rwa', 'exposicao total'],
      has: [['ponderados', 'risco']], not: ['credito', 'mercado', 'operacional']
    },
    rwaCredito: { label: 'RWA de crédito', has: [['rwa', 'credito']], exact: ['rwacpad'] },
    rwaMercado: { label: 'RWA de mercado', has: [['rwa', 'mercado']], exact: ['rwampad'] },
    rwaOperacional: { label: 'RWA operacional', has: [['rwa', 'operacional']], exact: ['rwaopad'] },
    provisao: {
      label: 'Provisão para créditos de liquidação duvidosa',
      exact: ['provisao sobre carteira de credito classificada', 'provisao', 'provisoes'],
      has: [['provis']], not: ['despesa', 'receita']
    },
    despesaProvisao: {
      label: 'Despesa de provisão',
      has: [['despesa', 'provis']], exact: ['despesas de provisao']
    },
    resultadoIntermediacao: {
      label: 'Resultado de intermediação financeira',
      exact: ['resultado de intermediacao financeira'], has: [['resultado', 'intermediacao']]
    },
    receitaIntermediacao: {
      label: 'Receitas de intermediação financeira',
      exact: ['receitas de intermediacao financeira'], has: [['receita', 'intermediacao']]
    },
    rendasServicos: {
      label: 'Rendas de prestação de serviços',
      exact: ['rendas de prestacao de servicos', 'receitas de prestacao de servicos'],
      has: [['prestacao', 'servicos']]
    },
    despesaPessoal: {
      label: 'Despesas de pessoal',
      exact: ['despesas de pessoal'], has: [['despesa', 'pessoal']]
    },
    despesaAdministrativa: {
      label: 'Despesas administrativas',
      exact: ['despesas administrativas', 'outras despesas administrativas'],
      has: [['despesa', 'administrativ']]
    },
    numeroAgencias: {
      label: 'Número de agências',
      exact: ['numero de agencias'], has: [['agencia']]
    },
    numeroPostos: {
      label: 'Postos de atendimento',
      exact: ['numero de postos de atendimento'], has: [['posto', 'atendimento']]
    }
  };

  /* --------------------------- resolução de campos -------------------- */

  function scoreColumn(colName, spec) {
    var n = U.norm(colName);
    if (!n) return 0;
    if (spec.not && spec.not.some(function (t) { return n.indexOf(U.norm(t)) >= 0; })) return 0;
    var i;
    if (spec.exact) {
      for (i = 0; i < spec.exact.length; i++) {
        if (n === U.norm(spec.exact[i])) return 1000 - i;
      }
    }
    if (spec.starts) {
      for (i = 0; i < spec.starts.length; i++) {
        if (n.indexOf(U.norm(spec.starts[i])) === 0) return 700 - i - Math.min(60, n.length);
      }
    }
    if (spec.has) {
      for (i = 0; i < spec.has.length; i++) {
        var terms = spec.has[i];
        var all = terms.every(function (t) { return n.indexOf(U.norm(t)) >= 0; });
        if (all) return 400 - i - Math.min(60, n.length);
      }
    }
    return 0;
  }

  /**
   * Casa colunas reais do dataset com os campos canônicos.
   * @param {string[]} columns nomes de coluna como vieram da API
   * @param {Object} [overrides] mapa campoCanonico -> nome de coluna forçado pelo usuário
   * @returns {{map: Object, score: Object, unmatched: string[]}}
   */
  function resolveFields(columns, overrides) {
    var map = {}, score = {};
    Object.keys(CAMPOS).forEach(function (canon) {
      var spec = CAMPOS[canon], best = null, bestScore = 0;
      columns.forEach(function (col) {
        var s = scoreColumn(col, spec);
        if (s > bestScore) { bestScore = s; best = col; }
      });
      if (best) { map[canon] = best; score[canon] = bestScore; }
    });
    if (overrides) {
      Object.keys(overrides).forEach(function (canon) {
        var v = overrides[canon];
        if (v === '__none__') { delete map[canon]; score[canon] = 0; }
        else if (v) { map[canon] = v; score[canon] = 9999; }
      });
    }
    var used = {};
    Object.keys(map).forEach(function (k) { used[map[k]] = true; });
    return {
      map: map, score: score,
      unmatched: columns.filter(function (c) { return !used[c]; })
    };
  }

  /* ---------------------------------------------------------------------
     Indicadores derivados.
     `f(campo)` devolve o valor numérico do campo canônico (ou null).
     `ctx` traz { anoMes, anualizar } — a DRE do IF.data é acumulada no ano,
     então resultados são multiplicados por 12/mês quando `anualizar`.
     --------------------------------------------------------------------- */

  function annualFactor(ctx) {
    if (!ctx || !ctx.anualizar || !ctx.anoMes) return 1;
    var mes = Number(String(ctx.anoMes).slice(4));
    return mes > 0 ? 12 / mes : 1;
  }
  function div(a, b, mult) {
    if (!U.isNum(a) || !U.isNum(b) || b === 0) return null;
    return (a / b) * (mult == null ? 1 : mult);
  }

  var INDICADORES = [
    { id: 'roe', label: 'ROE', unidade: '%', decimais: 1, melhor: 'alto',
      grupo: 'Rentabilidade', requer: ['lucroLiquido', 'patrimonioLiquido'],
      desc: 'Lucro líquido ÷ patrimônio líquido. Anualizado quando o resultado é acumulado no ano.',
      calc: function (f, ctx) { return div(f('lucroLiquido') * annualFactor(ctx), f('patrimonioLiquido'), 100); } },

    { id: 'roa', label: 'ROA', unidade: '%', decimais: 2, melhor: 'alto',
      grupo: 'Rentabilidade', requer: ['lucroLiquido', 'ativoTotal'],
      desc: 'Lucro líquido ÷ ativo total.',
      calc: function (f, ctx) { return div(f('lucroLiquido') * annualFactor(ctx), f('ativoTotal'), 100); } },

    { id: 'margemLiquida', label: 'Margem líquida', unidade: '%', decimais: 1, melhor: 'alto',
      grupo: 'Rentabilidade', requer: ['lucroLiquido', 'receitaIntermediacao'],
      desc: 'Lucro líquido ÷ receitas de intermediação financeira.',
      calc: function (f) { return div(f('lucroLiquido'), f('receitaIntermediacao'), 100); } },

    { id: 'eficiencia', label: 'Índice de eficiência', unidade: '%', decimais: 1, melhor: 'baixo',
      grupo: 'Rentabilidade',
      requer: ['despesaPessoal', 'despesaAdministrativa', 'resultadoIntermediacao'],
      desc: '(Despesas de pessoal + administrativas) ÷ (resultado de intermediação + rendas de serviços). Menor é melhor.',
      calc: function (f) {
        var desp = Math.abs(f('despesaPessoal') || 0) + Math.abs(f('despesaAdministrativa') || 0);
        var rec = (f('resultadoIntermediacao') || 0) + (f('rendasServicos') || 0);
        return desp && rec ? div(desp, rec, 100) : null;
      } },

    { id: 'basileia', label: 'Índice de Basileia', unidade: '%', decimais: 2, melhor: 'alto',
      grupo: 'Capital', requer: ['basileia'], direto: 'basileia',
      desc: 'Patrimônio de Referência ÷ RWA. Reportado pela instituição; mínimo regulatório 8% + adicionais.',
      calc: function (f) {
        var v = f('basileia');
        if (U.isNum(v)) return v;
        return div(f('patrimonioReferencia'), f('rwa'), 100);
      } },

    { id: 'icp', label: 'Índice de Capital Principal', unidade: '%', decimais: 2, melhor: 'alto',
      grupo: 'Capital', requer: ['indiceCapitalPrincipal'], direto: 'indiceCapitalPrincipal',
      desc: 'Capital Principal ÷ RWA (mínimo 4,5% + ACP).',
      calc: function (f) {
        var v = f('indiceCapitalPrincipal');
        if (U.isNum(v)) return v;
        return div(f('capitalPrincipal'), f('rwa'), 100);
      } },

    { id: 'in1', label: 'Índice de Nível I', unidade: '%', decimais: 2, melhor: 'alto',
      grupo: 'Capital', requer: ['indiceNivelI'], direto: 'indiceNivelI',
      desc: 'Capital de Nível I ÷ RWA (mínimo 6%).',
      calc: function (f) {
        var v = f('indiceNivelI');
        if (U.isNum(v)) return v;
        return div(f('capitalNivelI'), f('rwa'), 100);
      } },

    { id: 'razaoAlavancagem', label: 'Razão de alavancagem (RA)', unidade: '%', decimais: 2,
      melhor: 'alto', grupo: 'Capital', requer: ['razaoAlavancagem'], direto: 'razaoAlavancagem',
      desc: 'Capital de Nível I ÷ exposição total (mínimo 3%).',
      calc: function (f) { return f('razaoAlavancagem'); } },

    { id: 'alavancagemContabil', label: 'Alavancagem contábil', unidade: '×', decimais: 1,
      melhor: 'baixo', grupo: 'Capital', requer: ['ativoTotal', 'patrimonioLiquido'],
      desc: 'Ativo total ÷ patrimônio líquido.',
      calc: function (f) { return div(f('ativoTotal'), f('patrimonioLiquido')); } },

    { id: 'plAtivo', label: 'PL / Ativo', unidade: '%', decimais: 2, melhor: 'alto',
      grupo: 'Capital', requer: ['patrimonioLiquido', 'ativoTotal'],
      desc: 'Colchão de capital contábil sobre o ativo.',
      calc: function (f) { return div(f('patrimonioLiquido'), f('ativoTotal'), 100); } },

    { id: 'densidadeRWA', label: 'Densidade de RWA', unidade: '%', decimais: 1, melhor: 'baixo',
      grupo: 'Capital', requer: ['rwa', 'ativoTotal'],
      desc: 'RWA ÷ ativo total — quanto de risco ponderado cada real de ativo carrega.',
      calc: function (f) { return div(f('rwa'), f('ativoTotal'), 100); } },

    { id: 'creditoAtivo', label: 'Crédito / Ativo', unidade: '%', decimais: 1, melhor: null,
      grupo: 'Crédito & Liquidez', requer: ['carteiraCredito', 'ativoTotal'],
      desc: 'Peso da carteira de crédito no balanço.',
      calc: function (f) { return div(f('carteiraCredito'), f('ativoTotal'), 100); } },

    { id: 'ldr', label: 'Crédito / Captações (LDR)', unidade: '%', decimais: 1, melhor: 'baixo',
      grupo: 'Crédito & Liquidez', requer: ['carteiraCredito', 'captacoes'],
      desc: 'Proxy de liquidez estrutural: quanto da carteira está financiado por captações. Acima de 100% indica dependência de funding de mercado.',
      calc: function (f) {
        var cap = f('captacoes');
        if (!U.isNum(cap)) cap = f('depositos');
        return div(f('carteiraCredito'), cap, 100);
      } },

    { id: 'cobertura', label: 'Provisão / Carteira', unidade: '%', decimais: 2, melhor: null,
      grupo: 'Crédito & Liquidez', requer: ['provisao', 'carteiraCredito'],
      desc: 'Cobertura de provisão sobre a carteira classificada.',
      calc: function (f) { return div(Math.abs(f('provisao')), f('carteiraCredito'), 100); } },

    { id: 'custoCredito', label: 'Custo do crédito', unidade: '%', decimais: 2, melhor: 'baixo',
      grupo: 'Crédito & Liquidez', requer: ['despesaProvisao', 'carteiraCredito'],
      desc: 'Despesa de provisão anualizada ÷ carteira de crédito.',
      calc: function (f, ctx) {
        return div(Math.abs(f('despesaProvisao')) * annualFactor(ctx), f('carteiraCredito'), 100);
      } },

    { id: 'imobilizacao', label: 'Índice de imobilização', unidade: '%', decimais: 2, melhor: 'baixo',
      grupo: 'Capital', requer: ['indiceImobilizacao'], direto: 'indiceImobilizacao',
      desc: 'Limite regulatório de 50% do PR.',
      calc: function (f) { return f('indiceImobilizacao'); } }
  ];

  var INDICADOR_POR_ID = {};
  INDICADORES.forEach(function (m) { INDICADOR_POR_ID[m.id] = m; });

  /** Indicadores calculáveis dado o mapa de campos resolvidos. */
  function indicadoresDisponiveis(fieldMap) {
    return INDICADORES.filter(function (m) {
      if (m.direto && fieldMap[m.direto]) return true;
      return m.requer.every(function (c) { return !!fieldMap[c]; });
    });
  }

  /**
   * Calcula todos os indicadores para uma linha (registro de instituição).
   * @param {Object} row  linha larga { coluna: valor }
   * @param {Object} fieldMap  campoCanonico -> nome de coluna
   * @param {Object} ctx  { anoMes, anualizar }
   */
  function calcIndicadores(row, fieldMap, ctx) {
    function f(canon) {
      var col = fieldMap[canon];
      if (!col) return null;
      return U.toNumber(row[col]);
    }
    var out = {};
    INDICADORES.forEach(function (m) {
      var v = null;
      try { v = m.calc(f, ctx); } catch (e) { v = null; }
      out[m.id] = U.isNum(v) ? v : null;
    });
    return out;
  }

  /* ---------------------------------------------------------------------
     Agregação de grupos.
     Regra de ouro: estoques e fluxos somam; índices NUNCA são somados nem
     tirados por média simples — são recalculados a partir dos componentes
     agregados. Quando o componente não existe no relatório, cai para média
     ponderada pelo ativo e o resultado é marcado como aproximado.
     --------------------------------------------------------------------- */

  function agregarLinhas(rows, fieldMap, ctx) {
    var soma = {}, aviso = [];
    Object.keys(CAMPOS).forEach(function (canon) {
      var col = fieldMap[canon];
      if (!col) return;
      if (CAMPOS[canon].ratio) return;              // índices não somam
      var vals = rows.map(function (r) { return U.toNumber(r[col]); }).filter(U.isNum);
      soma[canon] = vals.length ? U.sum(vals) : null;
    });

    // índices reportados: média ponderada pelo ativo (aproximação explícita)
    var pesos = rows.map(function (r) {
      var col = fieldMap.ativoTotal;
      var v = col ? U.toNumber(r[col]) : null;
      return U.isNum(v) && v > 0 ? v : 0;
    });
    var pesoTotal = U.sum(pesos);
    Object.keys(CAMPOS).forEach(function (canon) {
      if (!CAMPOS[canon].ratio) return;
      var col = fieldMap[canon];
      if (!col) return;
      var num = 0, den = 0;
      rows.forEach(function (r, i) {
        var v = U.toNumber(r[col]);
        if (U.isNum(v) && pesos[i] > 0) { num += v * pesos[i]; den += pesos[i]; }
      });
      soma[canon] = den ? num / den : null;
      if (den) aviso.push(CAMPOS[canon].label);
    });

    function f(canon) { return U.isNum(soma[canon]) ? soma[canon] : null; }

    // recalcula índices a partir dos componentes sempre que possível
    if (U.isNum(soma.patrimonioReferencia) && U.isNum(soma.rwa) && soma.rwa) {
      soma.basileia = (soma.patrimonioReferencia / soma.rwa) * 100;
      aviso = aviso.filter(function (a) { return a !== CAMPOS.basileia.label; });
    }
    if (U.isNum(soma.capitalPrincipal) && U.isNum(soma.rwa) && soma.rwa) {
      soma.indiceCapitalPrincipal = (soma.capitalPrincipal / soma.rwa) * 100;
      aviso = aviso.filter(function (a) { return a !== CAMPOS.indiceCapitalPrincipal.label; });
    }
    if (U.isNum(soma.capitalNivelI) && U.isNum(soma.rwa) && soma.rwa) {
      soma.indiceNivelI = (soma.capitalNivelI / soma.rwa) * 100;
      aviso = aviso.filter(function (a) { return a !== CAMPOS.indiceNivelI.label; });
    }

    var ind = {};
    INDICADORES.forEach(function (m) {
      var v = null;
      try { v = m.calc(f, ctx); } catch (e) { v = null; }
      ind[m.id] = U.isNum(v) ? v : null;
    });

    return {
      campos: soma,
      indicadores: ind,
      n: rows.length,
      pesoTotal: pesoTotal,
      aproximados: U.unique(aviso)
    };
  }

  global.CAT = {
    TIPOS_INSTITUICAO: TIPOS_INSTITUICAO,
    RELATORIOS_FALLBACK: RELATORIOS_FALLBACK,
    CAMPOS: CAMPOS,
    INDICADORES: INDICADORES,
    INDICADOR_POR_ID: INDICADOR_POR_ID,
    resolveFields: resolveFields,
    indicadoresDisponiveis: indicadoresDisponiveis,
    calcIndicadores: calcIndicadores,
    agregarLinhas: agregarLinhas,
    annualFactor: annualFactor
  };
})(window);

</script>
  <script>
/* ===== pub-catalog.js ===== */
/* pub-catalog.js — domínio do módulo Publicações do Risk Bench.
   Fontes comparadas, famílias de indicadores e o catálogo de métricas.
   Namespace global `PUB`. */
(function (global) {
  'use strict';

  /* ---------------------------------------------------------------------
     As quatro publicações comparadas, mais o IF.data como linha de base.
     `automatica` marca a única fonte que o sistema consegue buscar sozinho:
     as demais são PDFs e planilhas de RI/CVM/SEC, sem API pública.
     --------------------------------------------------------------------- */
  var FONTES = [
    { id: 'brgaap', curto: 'BR GAAP', serie: 1,
      nome: 'Demonstrações trimestrais BR GAAP e notas explicativas',
      desc: 'Padrão contábil do COSIF, base do reporte ao BCB. Traz resultado, patrimônio, ' +
            'carteira e provisões, e nas notas a abertura por modalidade, faixa de risco e prazo.' },
    { id: 'ifrs', curto: 'IFRS', serie: 2,
      nome: 'Demonstrações trimestrais IFRS e notas explicativas',
      desc: 'Consolidado internacional. Diverge do BR GAAP sobretudo em perda esperada ' +
            '(IFRS 9, três estágios), hierarquia de valor justo e consolidação — por isso ' +
            'patrimônio e resultado raramente batem com o BR GAAP.' },
    { id: 'pilar3', curto: 'Pilar 3', serie: 3,
      nome: 'Relatório de gerenciamento de riscos — Pilar 3',
      desc: 'A fonte mais rica para risco: PR e suas parcelas, RWA aberto por tipo, ' +
            'LCR, NSFR, razão de alavancagem, VaR do trading book e IRRBB.' },
    { id: 'form20f', curto: '20-F', serie: 4,
      nome: 'Form 20-F (SEC)',

        var cor = d.color || Colors.of(d.key != null ? d.key : d.label);

        g.appendChild(U.svg('text', {
          class: 'mark-label', x: x0 - 10, y: yTopo + espessura / 2 + 4,
          'text-anchor': 'end', text: U.truncate(d.label, Math.floor(rotuloW / 6.6))
        }));

        var caminho = U.svg('path', {
          d: barPath(xIni, yTopo, Math.max(1.5, largura), espessura, d.value < 0 ? 'left' : 'right'),
          style: 'fill:' + cor
        });
        g.appendChild(caminho);

        // rótulo direto na ponta — sempre fora da barra, nunca cortado
        g.appendChild(U.svg('text', {
          class: 'mark-label' + (i === 0 ? ' mark-label--strong' : ''),
          x: (d.value < 0 ? xIni - 8 : xIni + largura + 8),
          y: yTopo + espessura / 2 + 4,
          'text-anchor': d.value < 0 ? 'end' : 'start',
          text: (cfg.fmtValor || U.compact)(d.value)
        }));

        var alvo = U.svg('rect', {
          x: x0 - rotuloW, y: padT + i * passo, width: W - (x0 - rotuloW), height: passo,
          fill: 'transparent', style: 'cursor:default'
        });
        alvo.addEventListener('mousemove', function (ev) {
          showTip('<div class="tip__title">' + escapeHTML(d.label) + '</div>' +
            tipRow(cor, cfg.serieLabel || 'Valor', (cfg.fmtTip || cfg.fmtValor || U.compact)(d.value)) +
            (d.nota ? '<div class="tip__note">' + escapeHTML(d.nota) + '</div>' : ''), ev);
        });
        alvo.addEventListener('mouseleave', hideTip);
        g.appendChild(alvo);
      });

      host.appendChild(svgEl);
    });
  }

  /* =====================================================================
     2. Colunas agrupadas ou empilhadas
     ===================================================================== */

  function colunas(node, cfg) {
    var grupos = cfg.groups || [];          // [{key,label}]
    var series = cfg.series || [];          // [{key,label,values:[]}]
    if (!grupos.length || !series.length) return vazio(node, cfg.vazio);
    var empilhado = cfg.modo === 'empilhado';

    var ocultas = {};
    function ativas() { return series.filter(function (s) { return !ocultas[s.key]; }); }

    return montar(node, function (host, W) {
      var legBox = U.el('div');
      var box = U.el('div');
      host.appendChild(legBox);
      host.appendChild(box);
      legenda(legBox, series.map(function (s) {
        return { key: s.key, label: s.label, color: s.color || Colors.of(s.key) };
      }), {
        onToggle: function (key, on) { ocultas[key] = !on; desenhar(); }
      });
      desenhar();

      function desenhar() {
        U.clear(box);
        var vis = ativas();
        var padL = 62, padR = 16, padT = cfg.tituloEixo ? 26 : 10, padB = 46;
        var H = cfg.altura || 320;
        var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

        var todos = [];
        grupos.forEach(function (_, gi) {
          if (empilhado) {
            var pos = 0, neg = 0;
            vis.forEach(function (s) {
              var v = s.values[gi];
              if (!U.isNum(v)) return;
              if (v >= 0) pos += v; else neg += v;
            });
            todos.push(pos, neg);
          } else {
            vis.forEach(function (s) { if (U.isNum(s.values[gi])) todos.push(s.values[gi]); });
          }
        });
        if (!todos.length) todos = [0, 1];
        var t = niceTicks(Math.min(0, Math.min.apply(null, todos)),
                          Math.max(0, Math.max.apply(null, todos)), 5);
        var sy = linear(t.min, t.max, y1, y0);
        var zero = sy(0);

        var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                                   'aria-label': cfg.aria || 'Gráfico de colunas' });
        var g = U.svg('g'); svgEl.appendChild(g);
        eixoY(g, sy, t.ticks, x0, x1, cfg.fmtEixo || U.compact);
        if (cfg.tituloEixo) {
          g.appendChild(U.svg('text', { class: 'axis-title', x: 2, y: y0 - 10,
                                        'text-anchor': 'start', text: cfg.tituloEixo }));
        }

        var banda = (x1 - x0) / grupos.length;
        var interno = Math.min(banda * 0.72, empilhado ? CAP : CAP * Math.max(1, vis.length));
        var espessura = empilhado ? Math.min(CAP, interno)
                                  : Math.min(CAP, (interno - GAP * (vis.length - 1)) / Math.max(1, vis.length));

        grupos.forEach(function (grupo, gi) {
          var centro = x0 + banda * (gi + 0.5);
          var larguraGrupo = empilhado ? espessura : espessura * vis.length + GAP * (vis.length - 1);
          var inicio = centro - larguraGrupo / 2;

          var acumPos = 0, acumNeg = 0;
          vis.forEach(function (s, si) {
            var v = s.values[gi];
            if (!U.isNum(v)) return;
            var cor = s.color || Colors.of(s.key);
            var xb, yb, hb;
            if (empilhado) {
              xb = inicio;
              var base = v >= 0 ? acumPos : acumNeg;
              var topo = base + v;
              yb = Math.min(sy(base), sy(topo));
              hb = Math.abs(sy(topo) - sy(base)) - GAP;
              if (v >= 0) acumPos = topo; else acumNeg = topo;
              if (hb < 0.8) return;
            } else {
              xb = inicio + si * (espessura + GAP);
              yb = Math.min(zero, sy(v));
              hb = Math.max(1.5, Math.abs(sy(v) - zero));
            }
            var lado = v >= 0 ? 'top' : 'bottom';
            var p = U.svg('path', { d: barPath(xb, yb, espessura, hb, empilhado ? 'top' : lado),
                                    style: 'fill:' + cor });
            p.addEventListener('mousemove', function (ev) {
              showTip('<div class="tip__title">' + escapeHTML(grupo.label) + '</div>' +
                tipRow(cor, s.label, (cfg.fmtValor || U.compact)(v)), ev);
            });
            p.addEventListener('mouseleave', hideTip);
            g.appendChild(p);
          });

          var rot = U.truncate(grupo.label, Math.max(6, Math.floor(banda / 7)));
          var txt = U.svg('text', { class: 'tick', x: centro, y: y1 + 16,
                                    'text-anchor': 'middle', text: rot });
          if (grupos.length > 8 || banda < 64) {
            txt.setAttribute('transform', 'rotate(-35 ' + centro + ' ' + (y1 + 16) + ')');
            txt.setAttribute('text-anchor', 'end');
          }
          g.appendChild(txt);
        });

        g.appendChild(U.svg('line', { class: 'baseline', x1: x0, x2: x1,
                                      y1: Math.round(zero) + 0.5, y2: Math.round(zero) + 0.5 }));
        box.appendChild(svgEl);
      }
    });
  }

  /* =====================================================================
     3. Linhas (série temporal) com crosshair e tooltip agregado
     ===================================================================== */

  function linhas(node, cfg) {
    var eixoX = cfg.x || [];                // rótulos de categoria (períodos)
    var series = cfg.series || [];          // [{key,label,values:[]}]
    if (!eixoX.length || !series.length) return vazio(node, cfg.vazio);
    var ocultas = {};

    return montar(node, function (host, W) {
      var legBox = U.el('div');
      var box = U.el('div');
      host.appendChild(legBox);
      host.appendChild(box);
      legenda(legBox, series.map(function (s) {
        return { key: s.key, label: s.label, color: s.color || Colors.of(s.key) };
      }), {
        linha: true,
        onToggle: function (key, on) { ocultas[key] = !on; desenhar(); }
      });
      desenhar();

      function desenhar() {
        U.clear(box);
        var vis = series.filter(function (s) { return !ocultas[s.key]; });
        var padL = 64, padR = cfg.rotularPontas === false ? 18 : 66;
        var padT = cfg.tituloEixo ? 26 : 12, padB = 40;
        var H = cfg.altura || 340;
        var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

        var todos = [];
        vis.forEach(function (s) { s.values.forEach(function (v) { if (U.isNum(v)) todos.push(v); }); });
        if (!todos.length) { box.appendChild(U.el('div', { class: 'chart__empty', text: 'Sem valores no período.' })); return; }
        var min = Math.min.apply(null, todos), max = Math.max.apply(null, todos);
        if (cfg.zeroObrigatorio) min = Math.min(0, min);
        // uma linha de referência só serve se couber no eixo
        if (U.isNum(cfg.referencia)) {
          min = Math.min(min, cfg.referencia);
          max = Math.max(max, cfg.referencia);
        }
        var folga = (max - min || Math.abs(max) || 1) * 0.08;
        var lo = min - folga, hi = max + folga;
        // séries só positivas nunca ganham eixo negativo — é espaço morto que
        // ainda sugere valores que não existem
        if (cfg.zeroObrigatorio && min >= 0) lo = 0;
        if (min >= 0 && lo < 0) lo = 0;
        var t = cfg.limites ? niceTicks(cfg.limites[0], cfg.limites[1], 5)
                            : niceTicks(lo, hi, 5);
        var sy = linear(t.min, t.max, y1, y0);
        var sx = function (i) {
          return eixoX.length === 1 ? (x0 + x1) / 2 : x0 + (i / (eixoX.length - 1)) * (x1 - x0);
        };

        var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                                   'aria-label': cfg.aria || 'Série temporal' });
        var g = U.svg('g'); svgEl.appendChild(g);
        eixoY(g, sy, t.ticks, x0, x1, cfg.fmtEixo || U.compact);
        if (cfg.tituloEixo) {
          g.appendChild(U.svg('text', { class: 'axis-title', x: 2, y: y0 - 10,
                                        'text-anchor': 'start', text: cfg.tituloEixo }));
        }
        if (U.isNum(cfg.referencia)) {
          var yr = Math.round(sy(cfg.referencia)) + 0.5;
          g.appendChild(U.svg('line', { x1: x0, x2: x1, y1: yr, y2: yr,
            style: 'stroke:var(--critical);stroke-width:1;opacity:.55' }));
          g.appendChild(U.svg('text', { class: 'mark-label', x: x0 + 4, y: yr - 5,
            text: cfg.referenciaLabel || ('Referência ' + U.fmt(cfg.referencia, 1)) }));
        }

        // rótulos do eixo X — no máximo ~10, sempre incluindo a última
        // no máximo ~10 rótulos, sempre incluindo o último — e sem deixar o
        // penúltimo colar nele
        var passoRot = Math.max(1, Math.ceil(eixoX.length / 9));
        var ultimoIdx = eixoX.length - 1;
        eixoX.forEach(function (rot, i) {
          var ultimo = i === ultimoIdx;
          if (!ultimo && (i % passoRot !== 0 || ultimoIdx - i < passoRot)) return;
          g.appendChild(U.svg('text', { class: 'tick', x: sx(i), y: y1 + 18,
                                        'text-anchor': 'middle', text: rot }));
        });
        g.appendChild(U.svg('line', { class: 'baseline', x1: x0, x2: x1,
                                      y1: Math.round(y1) + 0.5, y2: Math.round(y1) + 0.5 }));

        var superficie = getComputedStyle(document.body).getPropertyValue('--surface-1').trim() || '#fff';
        var pontas = [];

        vis.forEach(function (s) {
          var cor = s.color || Colors.of(s.key);
          var segmento = [], caminhos = [];
          s.values.forEach(function (v, i) {
            if (U.isNum(v)) segmento.push([sx(i), sy(v)]);
            else if (segmento.length) { caminhos.push(segmento); segmento = []; }
          });
          if (segmento.length) caminhos.push(segmento);

          caminhos.forEach(function (pts) {
            if (pts.length === 1) {
              g.appendChild(U.svg('circle', { cx: pts[0][0], cy: pts[0][1], r: 4,
                style: 'fill:' + cor + ';stroke:' + superficie + ';stroke-width:2' }));
              return;
            }
            var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
            if (cfg.area && vis.length === 1) {
              g.appendChild(U.svg('path', {
                d: d + 'L' + pts[pts.length - 1][0].toFixed(1) + ',' + y1 + 'L' + pts[0][0].toFixed(1) + ',' + y1 + 'Z',
                style: 'fill:' + cor + ';opacity:.10'
              }));
            }
            g.appendChild(U.svg('path', { d: d, style: 'fill:none;stroke:' + cor +
              ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round' }));
          });

          // ponta: marcador sempre; o rótulo direto entra depois, se couber
          var ultimo = -1;
          s.values.forEach(function (v, i) { if (U.isNum(v)) ultimo = i; });
          if (ultimo >= 0) {
            g.appendChild(U.svg('circle', { cx: sx(ultimo), cy: sy(s.values[ultimo]), r: 4,
              style: 'fill:' + cor + ';stroke:' + superficie + ';stroke-width:2' }));
            pontas.push({ x: sx(ultimo), y: sy(s.values[ultimo]), valor: s.values[ultimo] });
          }
        });

        /* Rótulo direto na ponta — só o valor (a legenda já carrega o nome).
           Quando as séries convergem no fim, empilhar rótulos os desgruda das
           linhas e vira ruído: nesse caso nenhum é desenhado e a leitura fica
           por conta da legenda, do crosshair e da aba Tabela. */
        if (cfg.rotularPontas !== false && pontas.length) {
          var ys = pontas.map(function (p) { return p.y; }).sort(function (a, b) { return a - b; });
          var colide = ys.some(function (y, i) { return i > 0 && y - ys[i - 1] < 13; });
          if (!colide) {
            pontas.forEach(function (p) {
              g.appendChild(U.svg('text', {
                class: 'mark-label', x: p.x + 10, y: p.y + 4,
                text: (cfg.fmtValor || U.compact)(p.valor)
              }));
            });
          }
        }

        // camada de crosshair
        var cross = U.svg('line', { class: 'gridline', y1: y0, y2: y1, x1: -99, x2: -99,
          style: 'stroke:var(--axis)' });
        g.appendChild(cross);
        var captura = U.svg('rect', { x: x0, y: y0, width: Math.max(1, x1 - x0), height: Math.max(1, y1 - y0),
          fill: 'transparent' });
        captura.addEventListener('mousemove', function (ev) {
          var caixa = svgEl.getBoundingClientRect();
          var escala = W / caixa.width;
          var px = (ev.clientX - caixa.left) * escala;
          var i = eixoX.length === 1 ? 0
            : Math.round(((px - x0) / (x1 - x0)) * (eixoX.length - 1));
          i = U.clamp(i, 0, eixoX.length - 1);
          cross.setAttribute('x1', sx(i)); cross.setAttribute('x2', sx(i));
          var html = '<div class="tip__title">' + escapeHTML(eixoX[i]) + '</div>';
          vis.slice()
            .sort(function (a, b) { return (b.values[i] || -Infinity) - (a.values[i] || -Infinity); })
            .forEach(function (s) {
              html += tipRow(s.color || Colors.of(s.key), s.label,
                (cfg.fmtValor || U.compact)(s.values[i]));
            });
          showTip(html, ev);
        });
        captura.addEventListener('mouseleave', function () {
          hideTip(); cross.setAttribute('x1', -99); cross.setAttribute('x2', -99);
        });
        g.appendChild(captura);

        box.appendChild(svgEl);
      }
    });
  }

  /* =====================================================================
     4. Dispersão (ex.: risco × retorno)
     ===================================================================== */

  function dispersao(node, cfg) {
    var pts = (cfg.points || []).filter(function (p) { return U.isNum(p.x) && U.isNum(p.y); });
    if (!pts.length) return vazio(node, cfg.vazio);

    return montar(node, function (host, W) {
      var padL = 64, padR = 20, padT = cfg.tituloY ? 28 : 14, padB = 48;
      var H = cfg.altura || 380;
      var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

      var tx = niceTicks(Math.min.apply(null, pts.map(function (p) { return p.x; })),
                         Math.max.apply(null, pts.map(function (p) { return p.x; })), 5);
      var ty = niceTicks(Math.min.apply(null, pts.map(function (p) { return p.y; })),
                         Math.max.apply(null, pts.map(function (p) { return p.y; })), 5);
      var sx = linear(tx.min, tx.max, x0, x1);
      var sy = linear(ty.min, ty.max, y1, y0);

      var raios = pts.map(function (p) { return U.isNum(p.size) && p.size > 0 ? p.size : 1; });
      var rMax = Math.max.apply(null, raios);
      function raio(p) {
        if (!cfg.dimensionar) return 5;
        var s = U.isNum(p.size) && p.size > 0 ? p.size : 0;
        return 4 + Math.sqrt(s / rMax) * 12;
      }

      var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                                 'aria-label': cfg.aria || 'Gráfico de dispersão' });
      var g = U.svg('g'); svgEl.appendChild(g);
      eixoY(g, sy, ty.ticks, x0, x1, cfg.fmtY || U.compact);
      tx.ticks.forEach(function (tv) {
        var x = Math.round(sx(tv)) + 0.5;
        g.appendChild(U.svg('line', { class: 'gridline', x1: x, x2: x, y1: y0, y2: y1 }));
        g.appendChild(U.svg('text', { class: 'tick', x: x, y: y1 + 17, 'text-anchor': 'middle',
                                      text: (cfg.fmtX || U.compact)(tv) }));
      });
      // medianas como referência de quadrante
      [['x', U.median(pts.map(function (p) { return p.x; }))],
       ['y', U.median(pts.map(function (p) { return p.y; }))]].forEach(function (par) {
        if (!U.isNum(par[1])) return;
        var attrs = par[0] === 'x'
          ? { x1: sx(par[1]), x2: sx(par[1]), y1: y0, y2: y1 }
          : { x1: x0, x2: x1, y1: sy(par[1]), y2: sy(par[1]) };
        attrs.style = 'stroke:var(--axis);stroke-width:1;opacity:.7';
        g.appendChild(U.svg('line', attrs));
      });

      g.appendChild(U.svg('text', { class: 'axis-title', x: (x0 + x1) / 2, y: H - 8,
                                    'text-anchor': 'middle', text: cfg.tituloX || '' }));
      g.appendChild(U.svg('text', { class: 'axis-title', x: 2, y: y0 - 10,
                                    'text-anchor': 'start', text: cfg.tituloY || '' }));

      var superficie = getComputedStyle(document.body).getPropertyValue('--surface-1').trim() || '#fff';
      pts.forEach(function (p) {
        var cor = p.color || Colors.of(p.key != null ? p.key : p.label);
        var c = U.svg('circle', { cx: sx(p.x), cy: sy(p.y), r: raio(p),
          style: 'fill:' + cor + ';stroke:' + superficie + ';stroke-width:2;opacity:.92' });
        function mostrar(ev) {
          showTip('<div class="tip__title">' + escapeHTML(p.label) + '</div>' +
            tipRow(cor, cfg.tituloX || 'X', (cfg.fmtX || U.compact)(p.x)) +
            tipRow(cor, cfg.tituloY || 'Y', (cfg.fmtY || U.compact)(p.y)) +
            (cfg.dimensionar && U.isNum(p.size)
              ? tipRow(null, cfg.tituloTamanho || 'Tamanho', U.compact(p.size)) : ''), ev);
        }
        // área de acerto generosa (>= 24px), separada da marca visível
        var alvo = U.svg('circle', { cx: sx(p.x), cy: sy(p.y), r: Math.max(12, raio(p) + 6),
                                     fill: 'transparent' });
        [c, alvo].forEach(function (n) {
          n.addEventListener('mousemove', mostrar);
          n.addEventListener('mouseleave', hideTip);
        });
        g.appendChild(c); g.appendChild(alvo);
      });

      // rótulos diretos apenas nos extremos
      var destaques = pts.slice()
        .sort(function (a, b) { return (b.size || 0) - (a.size || 0); })
        .slice(0, cfg.rotular || 5);
      destaques.forEach(function (p) {
        g.appendChild(U.svg('text', { class: 'mark-label', x: sx(p.x) + raio(p) + 5,
          y: sy(p.y) + 4, text: U.truncate(p.label, 20) }));
      });

      host.appendChild(svgEl);
    });
  }

  /* =====================================================================
     5. Heatmap (matriz) — rampa sequencial ou divergente
     ===================================================================== */

  function heatmap(node, cfg) {
    var linhasM = cfg.rows || [], colunasM = cfg.cols || [], valores = cfg.values || [];
    if (!linhasM.length || !colunasM.length) return vazio(node, cfg.vazio);

    return montar(node, function (host, W) {
      var rotuloW = Math.min(Math.max(110, Math.round(W * 0.26)), 260);
      var padT = 44, padB = 10, padR = 12;
      var cellH = cfg.alturaCelula || 26;
      var H = padT + padB + linhasM.length * cellH;
      var x0 = rotuloW, x1 = W - padR;
      var cellW = (x1 - x0) / colunasM.length;

      var planos = [];
      valores.forEach(function (lin) { lin.forEach(function (v) { if (U.isNum(v)) planos.push(v); }); });
      var vmin = planos.length ? Math.min.apply(null, planos) : 0;
      var vmax = planos.length ? Math.max.apply(null, planos) : 1;
      var divergente = cfg.escala === 'divergente';
      var lim = Math.max(Math.abs(vmin), Math.abs(vmax)) || 1;

      var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                                 'aria-label': cfg.aria || 'Matriz de calor' });
      var g = U.svg('g'); svgEl.appendChild(g);

      colunasM.forEach(function (c, j) {
        var cx = x0 + cellW * (j + 0.5);
        var txt = U.svg('text', { class: 'tick', x: cx, y: padT - 10, 'text-anchor': 'middle',
                                  text: U.truncate(c.label, Math.max(8, Math.floor(cellW / 7))) });
        if (cellW < 62) {
          txt.setAttribute('transform', 'rotate(-40 ' + cx + ' ' + (padT - 10) + ')');
          txt.setAttribute('text-anchor', 'start');
        }
        g.appendChild(txt);
      });

      linhasM.forEach(function (r, i) {
        var y = padT + i * cellH;
        g.appendChild(U.svg('text', { class: 'mark-label', x: x0 - 10, y: y + cellH / 2 + 4,
          'text-anchor': 'end', text: U.truncate(r.label, Math.floor(rotuloW / 6.6)) }));
        colunasM.forEach(function (c, j) {
          var v = (valores[i] || [])[j];
          var x = x0 + j * cellW;
          var cor = !U.isNum(v) ? 'var(--surface-sunk)'
            : divergente ? Colors.div(v / lim)
            : Colors.seq((v - vmin) / ((vmax - vmin) || 1));
          var cell = U.svg('rect', { x: x + 1, y: y + 1, width: Math.max(1, cellW - GAP),
            height: Math.max(1, cellH - GAP), rx: 3, style: 'fill:' + cor });
          cell.addEventListener('mousemove', function (ev) {
            showTip('<div class="tip__title">' + escapeHTML(r.label) + '</div>' +
              tipRow(cor, c.label, U.isNum(v) ? (cfg.fmtValor || U.compact)(v) : 'sem dado'), ev);
          });

            var t = divergente ? v / lim : (v - vmin) / ((vmax - vmin) || 1);

              style: 'font-size:10.5px;font-variant-numeric:tabular-nums;fill:' +
                Colors.tintaSobre(t, divergente),

      esc.appendChild(U.el('span', { text: (cfg.fmtValor || U.compact)(divergente ? -lim : vmin) }));

    return montar(node, function (host, W) {

      var H = cfg.altura || 330;
      var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

      var acum = cfg.base || 0, pontos = [acum];
      itens.forEach(function (it) {

          acum = U.isNum(it.value) && it.value !== 0 ? it.value : acum;
        } else {
          acum += U.isNum(it.value) ? it.value : 0;
        }
        pontos.push(acum);
      });
      var t = niceTicks(Math.min(0, Math.min.apply(null, pontos)),
                        Math.max(0, Math.max.apply(null, pontos)), 5);
      var sy = linear(t.min, t.max, y1, y0);

      var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',

      eixoY(g, sy, t.ticks, x0, x1, cfg.fmtEixo || U.compact);

      var banda = (x1 - x0) / itens.length;
      var espessura = Math.min(CAP, banda * 0.62);
      var corrente = cfg.base || 0;

      itens.forEach(function (it, i) {
        var centro = x0 + banda * (i + 0.5);
        var xb = centro - espessura / 2;
        var v = U.isNum(it.value) ? it.value : 0;
        var de, para, cor;
        if (it.total) {
          de = 0;
          para = U.isNum(it.value) && it.value !== 0 ? it.value : corrente;
          corrente = para;
          cor = 'var(--text-muted)';
        } else {
          de = corrente; para = corrente + v; corrente = para;
          cor = v >= 0 ? 'var(--seq-500)' : 'var(--div-pos)';
        }
        var yb = Math.min(sy(de), sy(para));
        var hb = Math.max(1.5, Math.abs(sy(para) - sy(de)));
        var p = U.svg('path', { d: barPath(xb, yb, espessura, hb, para >= de ? 'top' : 'bottom'),
                                style: 'fill:' + cor });
        p.addEventListener('mousemove', function (ev) {
          showTip('<div class="tip__title">' + escapeHTML(it.label) + '</div>' +
            tipRow(cor, it.total ? 'Total' : 'Contribuição', (cfg.fmtValor || U.compact)(it.total ? para : v)), ev);
        });
        p.addEventListener('mouseleave', hideTip);
        g.appendChild(p);

        g.appendChild(U.svg('text', { class: 'mark-label', x: centro,
          y: (para >= de ? yb - 6 : yb + hb + 14), 'text-anchor': 'middle',
          text: (cfg.fmtValor || U.compact)(it.total ? para : v) }));

        var rot = U.svg('text', { class: 'tick', x: centro, y: y1 + 16, 'text-anchor': 'middle',
          text: U.truncate(it.label, Math.max(6, Math.floor(banda / 6.5))) });
        if (itens.length > 6 || banda < 70) {
          rot.setAttribute('transform', 'rotate(-35 ' + centro + ' ' + (y1 + 16) + ')');
          rot.setAttribute('text-anchor', 'end');
        }
        g.appendChild(rot);
      });

      g.appendChild(U.svg('line', { class: 'baseline', x1: x0, x2: x1,
        y1: Math.round(sy(0)) + 0.5, y2: Math.round(sy(0)) + 0.5 }));
      host.appendChild(svgEl);
    });
  }

  /* =====================================================================
     7. Sparkline (dentro de stat tiles)
     ===================================================================== */

  function sparkline(node, valores, cor) {
    var v = (valores || []).filter(function (x) { return U.isNum(x); });
    if (v.length < 2) return vazio(node, '');
    return montar(node, function (host, W) {
      var H = 30, pad = 3;
      var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
      var sy = linear(min, max, H - pad, pad);
      var sx = linear(0, v.length - 1, pad, W - pad);
      var d = v.map(function (y, i) { return (i ? 'L' : 'M') + sx(i).toFixed(1) + ',' + sy(y).toFixed(1); }).join('');
      var svgEl = U.svg('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' }, [
        U.svg('path', { d: d, style: 'fill:none;stroke:var(--text-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.55' }),
        U.svg('circle', { cx: sx(v.length - 1), cy: sy(v[v.length - 1]), r: 3,
          style: 'fill:' + (cor || 'var(--accent)') })
      ]);
      host.appendChild(svgEl);
    });
  }

  global.CH = {
    Colors: Colors,
    ranking: ranking,
    colunas: colunas,
    linhas: linhas,
    dispersao: dispersao,
    heatmap: heatmap,
    waterfall: waterfall,
    sparkline: sparkline,
    vazio: vazio,
    niceTicks: niceTicks,
    escapeHTML: escapeHTML,
    hideTip: hideTip
  };
})(window);
